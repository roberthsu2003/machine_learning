<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#3bc9f0" font-weight="700" text-anchor="start">01 概念地圖</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">03 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">AI、ML、DL：看範圍；生成式 AI：看任務</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#3bc9f0" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">生成式 AI 多使用深度學習，但不是固定的第四層。</text><rect x="130" y="330" width="1050" height="575" rx="250" fill="#162441" stroke="#3bc9f0" stroke-width="5"/><rect x="250" y="445" width="810" height="360" rx="175" fill="#173a40" stroke="#30ddb0" stroke-width="5"/><rect x="380" y="555" width="550" height="160" rx="80" fill="#402855" stroke="#ac83ff" stroke-width="5"/><text x="455" y="405" font-size="43" fill="#3bc9f0" font-weight="700" text-anchor="start">人工智慧 AI</text><text x="470" y="520" font-size="42" fill="#30ddb0" font-weight="700" text-anchor="start">機器學習 ML</text><text x="650" y="655" font-size="39" fill="#ac83ff" font-weight="700" text-anchor="middle">深度學習 DL</text><rect x="1260" y="385" width="610" height="470" rx="22" fill="#2a1e3c" stroke="#ff6eab" stroke-width="4"/><text x="1320" y="475" font-size="49" fill="#ff6eab" font-weight="700" text-anchor="start">生成式 AI</text><text x="1320" y="560" font-size="34" fill="#f5f8ff" font-weight="400" text-anchor="start">任務：產生新內容</text><text x="1320" y="630" font-size="34" fill="#f5f8ff" font-weight="400" text-anchor="start">例：文字、圖片</text><text x="1320" y="720" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">常見方法：深度學習</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#3bc9f0" font-weight="600" text-anchor="start">例：決策樹屬於 ML；神經網路屬於 DL；文字生成是 GenAI 任務。</text></g></svg>