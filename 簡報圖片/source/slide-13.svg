<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#30ddb0" font-weight="700" text-anchor="start">02 模型流程</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">13 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">預測新房屋：只有輸入，沒有真實答案</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#30ddb0" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">先使用第 10 頁的單特徵示意模型。</text><rect x="130" y="375" width="500" height="420" rx="18" fill="#142443" stroke="#3bc9f0" stroke-width="3"/><rect x="750" y="375" width="500" height="420" rx="18" fill="#142443" stroke="#ac83ff" stroke-width="3"/><rect x="1370" y="375" width="500" height="420" rx="18" fill="#142443" stroke="#30ddb0" stroke-width="3"/><text x="380" y="465" font-size="45" fill="#3bc9f0" font-weight="700" text-anchor="middle">新房屋</text><text x="380" y="565" font-size="45" fill="#f5f8ff" font-weight="600" text-anchor="middle">60 坪</text><text x="1000" y="465" font-size="43" fill="#ac83ff" font-weight="700" text-anchor="middle">已訓練模型</text><text x="1000" y="565" font-size="38" fill="#f5f8ff" font-weight="500" text-anchor="middle">10.2 × 60 − 15</text><text x="1620" y="465" font-size="43" fill="#30ddb0" font-weight="700" text-anchor="middle">預測價格</text><text x="1620" y="565" font-size="44" fill="#f5f8ff" font-weight="700" text-anchor="middle">597 萬元</text><text x="690" y="590" font-size="54" fill="#3bc9f0" font-weight="700" text-anchor="middle">→</text><text x="1310" y="590" font-size="54" fill="#30ddb0" font-weight="700" text-anchor="middle">→</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#30ddb0" font-weight="600" text-anchor="start">597 是估計值，不是真實成交價；不同模型可能給不同答案。</text></g></svg>