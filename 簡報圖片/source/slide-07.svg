<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#30ddb0" font-weight="700" text-anchor="start">02 模型流程</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">07 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">先分資料，才開始訓練</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#30ddb0" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">把測試資料留到最後，檢查模型遇到新資料的表現。</text><rect x="130" y="360" width="1740" height="165" rx="18" fill="#142443" stroke="#30ddb0" stroke-width="3"/><text x="1000" y="465" font-size="45" fill="#f5f8ff" font-weight="700" text-anchor="middle">全部已知資料</text><text x="1000" y="600" font-size="55" fill="#30ddb0" font-weight="700" text-anchor="middle">↓</text><rect x="130" y="660" width="780" height="215" rx="18" fill="#142443" stroke="#3bc9f0" stroke-width="3"/><rect x="1090" y="660" width="780" height="215" rx="18" fill="#142443" stroke="#ffbd64" stroke-width="3"/><text x="520" y="748" font-size="43" fill="#3bc9f0" font-weight="700" text-anchor="middle">訓練資料</text><text x="520" y="815" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="middle">用來學習規律</text><text x="1480" y="748" font-size="43" fill="#ffbd64" font-weight="700" text-anchor="middle">測試資料</text><text x="1480" y="815" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="middle">留到最後檢查</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#30ddb0" font-weight="600" text-anchor="start">測試資料的答案不能提前參與訓練，否則分數可能失真。</text></g></svg>