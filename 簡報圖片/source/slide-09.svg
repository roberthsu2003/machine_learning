<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#30ddb0" font-weight="700" text-anchor="start">02 模型流程</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">09 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">分類例子：模型怎麼判斷貓或狗？</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#30ddb0" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">這是一筆資料的教學示意，不代表完整影像辨識系統。</text><rect x="130" y="350" width="500" height="390" rx="18" fill="#142443" stroke="#3bc9f0" stroke-width="3"/><rect x="750" y="350" width="500" height="390" rx="18" fill="#142443" stroke="#ac83ff" stroke-width="3"/><rect x="1370" y="350" width="500" height="390" rx="18" fill="#142443" stroke="#30ddb0" stroke-width="3"/><text x="380" y="450" font-size="44" fill="#3bc9f0" font-weight="700" text-anchor="middle">輸入 X</text><text x="380" y="550" font-size="37" fill="#f5f8ff" font-weight="400" text-anchor="middle">一張狗的照片</text><text x="1000" y="450" font-size="44" fill="#ac83ff" font-weight="700" text-anchor="middle">模型預測</text><text x="1000" y="545" font-size="39" fill="#f5f8ff" font-weight="400" text-anchor="middle">貓 80%</text><text x="1000" y="620" font-size="39" fill="#f5f8ff" font-weight="400" text-anchor="middle">狗 20%</text><text x="1620" y="450" font-size="44" fill="#30ddb0" font-weight="700" text-anchor="middle">正確答案 y</text><text x="1620" y="550" font-size="48" fill="#f5f8ff" font-weight="700" text-anchor="middle">狗</text><text x="1000" y="835" font-size="34" fill="#ffbd64" font-weight="600" text-anchor="middle">預測與答案不同 → 計算誤差 → 調整參數</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#30ddb0" font-weight="600" text-anchor="start">分類模型常輸出各類別的機率，再選擇預測類別。</text></g></svg>