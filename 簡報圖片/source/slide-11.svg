<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#30ddb0" font-weight="700" text-anchor="start">02 模型流程</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">11 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">如何知道預測好不好？</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#30ddb0" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">先看測試資料，再選與問題相符的指標。</text><rect x="130" y="350" width="800" height="495" rx="18" fill="#142443" stroke="#3bc9f0" stroke-width="3"/><rect x="1070" y="350" width="800" height="495" rx="18" fill="#142443" stroke="#ffbd64" stroke-width="3"/><text x="190" y="445" font-size="43" fill="#3bc9f0" font-weight="700" text-anchor="start">分類：答對了多少？</text><text x="190" y="545" font-size="33" fill="#f5f8ff" font-weight="400" text-anchor="start">正確率 = 答對筆數 ÷ 總筆數</text><text x="190" y="650" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">類別不平衡時，還要看漏判。</text><text x="1130" y="445" font-size="43" fill="#ffbd64" font-weight="700" text-anchor="start">迴歸：差了多少？</text><text x="1130" y="545" font-size="33" fill="#f5f8ff" font-weight="400" text-anchor="start">絕對誤差 = |預測 − 真值|</text><text x="1130" y="650" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">平均絕對誤差 MAE：越小越好。</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#30ddb0" font-weight="600" text-anchor="start">訓練分數與測試分數都要看；差距太大可能是過度擬合。</text></g></svg>