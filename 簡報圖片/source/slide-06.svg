<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#30ddb0" font-weight="700" text-anchor="start">02 模型流程</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">06 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">每一筆資料都有輸入 X 與答案 y</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#30ddb0" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">房價例子：坪數是特徵 X；成交價是標籤 y。</text><rect x="130" y="345" width="1740" height="510" rx="18" fill="#142443" stroke="#30ddb0" stroke-width="3"/><text x="250" y="430" font-size="35" fill="#30ddb0" font-weight="700" text-anchor="start">房屋</text><text x="700" y="430" font-size="35" fill="#30ddb0" font-weight="700" text-anchor="start">坪數 X</text><text x="1300" y="430" font-size="35" fill="#30ddb0" font-weight="700" text-anchor="start">成交價 y</text><line x1="220" y1="475" x2="1780" y2="475" stroke="#354660" stroke-width="2"/><text x="250" y="520" font-size="36" fill="#f5f8ff" font-weight="400" text-anchor="start">#101</text><text x="700" y="520" font-size="36" fill="#f5f8ff" font-weight="400" text-anchor="start">18 坪</text><text x="1300" y="520" font-size="36" fill="#f5f8ff" font-weight="400" text-anchor="start">180 萬元</text><line x1="220" y1="580" x2="1780" y2="580" stroke="#354660" stroke-width="2"/><text x="250" y="625" font-size="36" fill="#f5f8ff" font-weight="400" text-anchor="start">#102</text><text x="700" y="625" font-size="36" fill="#f5f8ff" font-weight="400" text-anchor="start">50 坪</text><text x="1300" y="625" font-size="36" fill="#f5f8ff" font-weight="400" text-anchor="start">500 萬元</text><line x1="220" y1="685" x2="1780" y2="685" stroke="#354660" stroke-width="2"/><text x="250" y="730" font-size="36" fill="#f5f8ff" font-weight="400" text-anchor="start">#103</text><text x="700" y="730" font-size="36" fill="#f5f8ff" font-weight="400" text-anchor="start">95 坪</text><text x="1300" y="730" font-size="36" fill="#f5f8ff" font-weight="400" text-anchor="start">950 萬元</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#30ddb0" font-weight="600" text-anchor="start">訓練時給模型 X 和 y；真正預測時只有新房屋的 X。</text></g></svg>