<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#3bc9f0" font-weight="700" text-anchor="start">01 概念地圖</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">02 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">這堂課只走一條路</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#3bc9f0" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">用房價預測串起所有名詞與步驟。</text><circle cx="230" cy="450" r="53" fill="#3bc9f0" stroke="#3bc9f0" stroke-width="3"/><text x="230" y="466" font-size="45" fill="#081128" font-weight="700" text-anchor="middle">1</text><text x="230" y="600" font-size="38" fill="#f5f8ff" font-weight="700" text-anchor="middle">提出問題</text><text x="230" y="665" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="middle">要預測房價</text><text x="405" y="470" font-size="57" fill="#3bc9f0" font-weight="600" text-anchor="middle">→</text><circle cx="580" cy="450" r="53" fill="#3bc9f0" stroke="#3bc9f0" stroke-width="3"/><text x="580" y="466" font-size="45" fill="#081128" font-weight="700" text-anchor="middle">2</text><text x="580" y="600" font-size="38" fill="#f5f8ff" font-weight="700" text-anchor="middle">整理資料</text><text x="580" y="665" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="middle">坪數與成交價</text><text x="755" y="470" font-size="57" fill="#3bc9f0" font-weight="600" text-anchor="middle">→</text><circle cx="930" cy="450" r="53" fill="#3bc9f0" stroke="#3bc9f0" stroke-width="3"/><text x="930" y="466" font-size="45" fill="#081128" font-weight="700" text-anchor="middle">3</text><text x="930" y="600" font-size="38" fill="#f5f8ff" font-weight="700" text-anchor="middle">訓練模型</text><text x="930" y="665" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="middle">從例子找規律</text><text x="1105" y="470" font-size="57" fill="#3bc9f0" font-weight="600" text-anchor="middle">→</text><circle cx="1280" cy="450" r="53" fill="#3bc9f0" stroke="#3bc9f0" stroke-width="3"/><text x="1280" y="466" font-size="45" fill="#081128" font-weight="700" text-anchor="middle">4</text><text x="1280" y="600" font-size="38" fill="#f5f8ff" font-weight="700" text-anchor="middle">檢查表現</text><text x="1280" y="665" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="middle">用未見資料測試</text><text x="1455" y="470" font-size="57" fill="#3bc9f0" font-weight="600" text-anchor="middle">→</text><circle cx="1630" cy="450" r="53" fill="#3bc9f0" stroke="#3bc9f0" stroke-width="3"/><text x="1630" y="466" font-size="45" fill="#081128" font-weight="700" text-anchor="middle">5</text><text x="1630" y="600" font-size="38" fill="#f5f8ff" font-weight="700" text-anchor="middle">預測新屋</text><text x="1630" y="665" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="middle">輸出估計價格</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#3bc9f0" font-weight="600" text-anchor="start">順序記法：問題 → 資料 → 訓練 → 檢查 → 預測</text></g></svg>