<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#3bc9f0" font-weight="700" text-anchor="start">01 概念地圖</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">04 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">機器學習做了什麼？</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#3bc9f0" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">以監督式學習中的「判斷垃圾郵件」為例。</text><rect x="130" y="350" width="800" height="500" rx="18" fill="#142443" stroke="#3bc9f0" stroke-width="3"/><rect x="1070" y="350" width="800" height="500" rx="18" fill="#142443" stroke="#30ddb0" stroke-width="3"/><text x="190" y="450" font-size="48" fill="#3bc9f0" font-weight="700" text-anchor="start">寫規則</text><text x="190" y="545" font-size="37" fill="#f5f8ff" font-weight="400" text-anchor="start">人先決定判斷條件</text><text x="190" y="635" font-size="32" fill="#b4c0d4" font-weight="400" text-anchor="start">例如：標題含「中獎」就攔截</text><text x="1130" y="450" font-size="48" fill="#30ddb0" font-weight="700" text-anchor="start">用資料學習</text><text x="1130" y="545" font-size="37" fill="#f5f8ff" font-weight="400" text-anchor="start">給模型郵件與正確標籤</text><text x="1130" y="635" font-size="32" fill="#b4c0d4" font-weight="400" text-anchor="start">由模型調整判斷方式</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#3bc9f0" font-weight="600" text-anchor="start">機器學習需要清楚的問題、可用資料，以及檢查結果的方法。</text></g></svg>