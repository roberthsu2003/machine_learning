<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#30ddb0" font-weight="700" text-anchor="start">02 模型流程</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">08 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">訓練，就是反覆減少預測誤差</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#30ddb0" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">模型不是「記住答案」；它要學到能用於新資料的規律。</text><rect x="130" y="390" width="390" height="225" rx="18" fill="#142443" stroke="#30ddb0" stroke-width="3"/><text x="325" y="470" font-size="42" fill="#30ddb0" font-weight="700" text-anchor="middle">1</text><text x="325" y="555" font-size="34" fill="#f5f8ff" font-weight="600" text-anchor="middle">輸入訓練資料</text><text x="548" y="515" font-size="45" fill="#30ddb0" font-weight="700" text-anchor="middle">→</text><rect x="575" y="390" width="390" height="225" rx="18" fill="#142443" stroke="#30ddb0" stroke-width="3"/><text x="770" y="470" font-size="42" fill="#30ddb0" font-weight="700" text-anchor="middle">2</text><text x="770" y="555" font-size="34" fill="#f5f8ff" font-weight="600" text-anchor="middle">模型給出預測</text><text x="993" y="515" font-size="45" fill="#30ddb0" font-weight="700" text-anchor="middle">→</text><rect x="1020" y="390" width="390" height="225" rx="18" fill="#142443" stroke="#30ddb0" stroke-width="3"/><text x="1215" y="470" font-size="42" fill="#30ddb0" font-weight="700" text-anchor="middle">3</text><text x="1215" y="555" font-size="34" fill="#f5f8ff" font-weight="600" text-anchor="middle">比較預測與答案</text><text x="1438" y="515" font-size="45" fill="#30ddb0" font-weight="700" text-anchor="middle">→</text><rect x="1465" y="390" width="390" height="225" rx="18" fill="#142443" stroke="#30ddb0" stroke-width="3"/><text x="1660" y="470" font-size="42" fill="#30ddb0" font-weight="700" text-anchor="middle">4</text><text x="1660" y="555" font-size="34" fill="#f5f8ff" font-weight="600" text-anchor="middle">調整模型參數</text><text x="1000" y="740" font-size="43" fill="#3bc9f0" font-weight="700" text-anchor="middle">重複多次，再用測試資料檢查。</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#30ddb0" font-weight="600" text-anchor="start">訓練誤差低，不等於新資料一定預測得準。</text></g></svg>