<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#ffbd64" font-weight="700" text-anchor="start">03 動手預測</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">14 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">五分鐘練習：你會怎麼預測？</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#ffbd64" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">先自己估計，再用 Python 計算。不要先看下一頁。</text><rect x="130" y="350" width="795" height="520" rx="18" fill="#142443" stroke="#ffbd64" stroke-width="3"/><rect x="1075" y="350" width="795" height="520" rx="18" fill="#142443" stroke="#3bc9f0" stroke-width="3"/><text x="190" y="440" font-size="42" fill="#ffbd64" font-weight="700" text-anchor="start">已知成交資料</text><text x="190" y="535" font-size="31" fill="#f5f8ff" font-weight="400" text-anchor="start">18坪→180萬　23坪→200萬</text><text x="190" y="600" font-size="31" fill="#f5f8ff" font-weight="400" text-anchor="start">42坪→400萬　50坪→500萬</text><text x="190" y="665" font-size="31" fill="#f5f8ff" font-weight="400" text-anchor="start">66坪→650萬　95坪→950萬</text><text x="190" y="790" font-size="35" fill="#ffbd64" font-weight="600" text-anchor="start">你估計 72 坪：______ 萬元</text><text x="1135" y="440" font-size="42" fill="#3bc9f0" font-weight="700" text-anchor="start">在 Colab 執行</text><text x="1135" y="540" font-size="39" fill="#f5f8ff" font-weight="400" text-anchor="start">x = 72</text><text x="1135" y="615" font-size="39" fill="#f5f8ff" font-weight="400" text-anchor="start">y = 10.2 * x - 15</text><text x="1135" y="690" font-size="39" fill="#f5f8ff" font-weight="400" text-anchor="start">print(y)</text><text x="1135" y="750" font-size="29" fill="#b4c0d4" font-weight="400" text-anchor="start">colab.research.google.com</text><text x="1135" y="825" font-size="35" fill="#3bc9f0" font-weight="600" text-anchor="start">記下輸出：______ 萬元</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#ffbd64" font-weight="600" text-anchor="start">比較自己的估計與模型輸出，再說出可能的誤差來源。</text></g></svg>