<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#30ddb0" font-weight="700" text-anchor="start">02 模型流程</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">05 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">先問：你要預測哪一種答案？</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#30ddb0" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">問題類型決定資料、模型與評估方式。</text><rect x="130" y="345" width="800" height="520" rx="18" fill="#142443" stroke="#3bc9f0" stroke-width="3"/><rect x="1070" y="345" width="800" height="520" rx="18" fill="#142443" stroke="#ffbd64" stroke-width="3"/><text x="190" y="450" font-size="51" fill="#3bc9f0" font-weight="700" text-anchor="start">分類</text><text x="190" y="550" font-size="39" fill="#f5f8ff" font-weight="400" text-anchor="start">答案是類別</text><text x="190" y="640" font-size="32" fill="#b4c0d4" font-weight="400" text-anchor="start">例：貓或狗、垃圾郵件或正常郵件</text><text x="190" y="755" font-size="31" fill="#3bc9f0" font-weight="400" text-anchor="start">輸出：類別或各類別的機率</text><text x="1130" y="450" font-size="51" fill="#ffbd64" font-weight="700" text-anchor="start">迴歸</text><text x="1130" y="550" font-size="39" fill="#f5f8ff" font-weight="400" text-anchor="start">答案是數值</text><text x="1130" y="640" font-size="32" fill="#b4c0d4" font-weight="400" text-anchor="start">例：房價、每日營收</text><text x="1130" y="755" font-size="31" fill="#ffbd64" font-weight="400" text-anchor="start">輸出：一個估計數值</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#30ddb0" font-weight="600" text-anchor="start">本講義用房價迴歸示範完整流程。</text></g></svg>