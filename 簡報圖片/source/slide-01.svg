<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="100" font-size="34" fill="#3bc9f0" font-weight="600" text-anchor="start">徐國堂 Python 實作應用班</text><text x="130" y="335" font-size="78" fill="#f5f8ff" font-weight="700" text-anchor="start">機器學習，從資料到預測</text><text x="130" y="430" font-size="39" fill="#b4c0d4" font-weight="400" text-anchor="start">一份給初學者的 15 頁學習路線</text><line x1="130" y1="500" x2="1870" y2="500" stroke="#3bc9f0" stroke-width="4"/><text x="130" y="610" font-size="49" fill="#3bc9f0" font-weight="700" text-anchor="start">01</text><text x="130" y="690" font-size="43" fill="#f5f8ff" font-weight="700" text-anchor="start">看懂概念</text><text x="130" y="755" font-size="30" fill="#b4c0d4" font-weight="400" text-anchor="start">AI、ML、DL 與問題類型</text><text x="720" y="610" font-size="49" fill="#30ddb0" font-weight="700" text-anchor="start">02</text><text x="720" y="690" font-size="43" fill="#f5f8ff" font-weight="700" text-anchor="start">學會流程</text><text x="720" y="755" font-size="30" fill="#b4c0d4" font-weight="400" text-anchor="start">資料、訓練、測試與評估</text><text x="1310" y="610" font-size="49" fill="#ffbd64" font-weight="700" text-anchor="start">03</text><text x="1310" y="690" font-size="43" fill="#f5f8ff" font-weight="700" text-anchor="start">做出預測</text><text x="1310" y="755" font-size="30" fill="#b4c0d4" font-weight="400" text-anchor="start">房價範例與五分鐘練習</text><text x="130" y="1020" font-size="34" fill="#f5f8ff" font-weight="400" text-anchor="start">學完後，你能說清楚模型如何學習，也能判斷預測值能不能相信。</text></g></svg>