<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125"><g font-family="Heiti TC, PingFang TC, sans-serif"><rect x="0" y="0" width="2000" height="1125" rx="0" fill="#081128" stroke="#081128" stroke-width="0"/><text x="130" y="75" font-size="28" fill="#ffbd64" font-weight="700" text-anchor="start">03 動手預測</text><text x="1860" y="75" font-size="27" fill="#b4c0d4" font-weight="400" text-anchor="end">15 / 15</text><text x="130" y="175" font-size="58" fill="#f5f8ff" font-weight="700" text-anchor="start">答案與離開教室前的三個確認</text><line x1="130" y1="218" x2="1870" y2="218" stroke="#ffbd64" stroke-width="3"/><text x="130" y="270" font-size="31" fill="#b4c0d4" font-weight="400" text-anchor="start">72 坪代入示意模型：10.2 × 72 − 15 = 719.4 萬元。</text><rect x="130" y="350" width="1740" height="145" rx="18" fill="#142443" stroke="#ffbd64" stroke-width="3"/><text x="195" y="442" font-size="50" fill="#ffbd64" font-weight="700" text-anchor="start">1</text><text x="315" y="415" font-size="37" fill="#f5f8ff" font-weight="700" text-anchor="start">X 與 y 是什麼？</text><text x="315" y="465" font-size="29" fill="#b4c0d4" font-weight="400" text-anchor="start">坪數是 X；成交價是 y。</text><rect x="130" y="535" width="1740" height="145" rx="18" fill="#142443" stroke="#ffbd64" stroke-width="3"/><text x="195" y="627" font-size="50" fill="#ffbd64" font-weight="700" text-anchor="start">2</text><text x="315" y="600" font-size="37" fill="#f5f8ff" font-weight="700" text-anchor="start">何時使用測試資料？</text><text x="315" y="650" font-size="29" fill="#b4c0d4" font-weight="400" text-anchor="start">訓練完成後，檢查新資料表現。</text><rect x="130" y="720" width="1740" height="145" rx="18" fill="#142443" stroke="#ffbd64" stroke-width="3"/><text x="195" y="812" font-size="50" fill="#ffbd64" font-weight="700" text-anchor="start">3</text><text x="315" y="785" font-size="37" fill="#f5f8ff" font-weight="700" text-anchor="start">719.4 是真實價格嗎？</text><text x="315" y="835" font-size="29" fill="#b4c0d4" font-weight="400" text-anchor="start">不是；只是單特徵模型的估計。</text><line x1="130" y1="985" x2="1870" y2="985" stroke="#354660" stroke-width="2"/><text x="130" y="1043" font-size="33" fill="#ffbd64" font-weight="600" text-anchor="start">下一步：用課程範例練習資料清理、建模與評估。</text></g></svg>