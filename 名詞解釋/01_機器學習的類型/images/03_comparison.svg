<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="499" viewBox="0 0 1200 499" role="img" aria-labelledby="title desc">
<title id="title">機器學習的類型：監督式與非監督式</title>
<desc id="desc">以向量圖形和文字重製的教學圖解。原始 PNG 保留於同一資料夾。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#1e293b} .heading{font-weight:700}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="499" fill="#fff"/>
<text x="600" y="43" font-size="29" text-anchor="middle" class="heading">機器學習的類型：監督式與非監督式</text>
<rect x="40.0" y="85" width="548.0" height="335" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="60.0" y="120" font-size="24" class="heading" style="fill:#2563eb">監督式學習 Supervised Learning</text>
<text x="60.0" y="162" font-size="22">輸入：特徵 X ＋已知標籤 y。</text>
<text x="60.0" y="207" font-size="22">目標：學出從 X 到 y 的預測規則。</text>
<text x="60.0" y="252" font-size="22">分類：預測離散類別，例如垃圾郵件／一般郵件。</text>
<text x="60.0" y="297" font-size="22">回歸：預測連續數值，例如房價、氣溫。</text>
<text x="60.0" y="342" font-size="22">評估：比較預測 ŷ 與真實標籤 y。</text>
<rect x="612.0" y="85" width="548.0" height="335" rx="12" fill="#f0fdf4" stroke="#16834a" stroke-width="2"/>
<text x="632.0" y="120" font-size="24" class="heading" style="fill:#16834a">非監督式學習 Unsupervised Learning</text>
<text x="632.0" y="162" font-size="22">輸入：只有特徵 X，沒有提供標籤 y。</text>
<text x="632.0" y="207" font-size="22">目標：尋找資料內部的結構與相似性。</text>
<text x="632.0" y="252" font-size="22">分群：將相似樣本分在一起，例如顧客分群。</text>
<text x="632.0" y="297" font-size="22">降維：用較少的特徵表示資料，例如 PCA。</text>
<text x="632.0" y="342" font-size="22">評估：依任務檢查群內相似性或資訊保留程度。</text>
<text x="600" y="476" font-size="20" text-anchor="middle">補充：半監督式使用少量標籤；強化學習以行動與獎勵回饋學習。</text>
</svg>
