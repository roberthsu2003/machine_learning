<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="395" viewBox="0 0 1200 395" role="img" aria-labelledby="title desc">
<title id="title">資料分割：先保留最後的客觀驗收</title>
<desc id="desc">以向量圖形和文字重製的教學圖解。原始 PNG 保留於同一資料夾。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#1e293b} .heading{font-weight:700}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="395" fill="#fff"/>
<text x="600" y="43" font-size="29" text-anchor="middle" class="heading">資料分割：先保留最後的客觀驗收</text>
<rect x="40.0" y="85" width="357.3333333333333" height="231" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="60.0" y="120" font-size="24" class="heading" style="fill:#2563eb">Train：60%～70%（示例）</text>
<text x="60.0" y="162" font-size="22">學習權重與其他模型參數。</text>
<text x="60.0" y="207" font-size="22">預處理、特徵選擇只在 Train </text>
<text x="60.0" y="238" font-size="22">fit。</text>
<rect x="421.3333333333333" y="85" width="357.3333333333333" height="231" rx="12" fill="#f0fdf4" stroke="#16834a" stroke-width="2"/>
<text x="441.3333333333333" y="120" font-size="24" class="heading" style="fill:#16834a">Validation：15%～20%（示</text>
<text x="441.3333333333333" y="151" font-size="24" class="heading" style="fill:#16834a">例）</text>
<text x="441.3333333333333" y="193" font-size="22">調整超參數、挑模型與早停。</text>
<text x="441.3333333333333" y="238" font-size="22">不能替代最終測試集。</text>
<rect x="802.6666666666666" y="85" width="357.3333333333333" height="231" rx="12" fill="#fffbeb" stroke="#b86a10" stroke-width="2"/>
<text x="822.6666666666666" y="120" font-size="24" class="heading" style="fill:#b86a10">Test：15%～20%（示例）</text>
<text x="822.6666666666666" y="162" font-size="22">模型定型後再進行最終評估。</text>
<text x="822.6666666666666" y="207" font-size="22">不得用於訓練或挑選設定。</text>
<text x="600" y="372" font-size="20" text-anchor="middle">比例須合計 100%；訓練得到的預處理規則才可應用到其他子集。</text>
</svg>
