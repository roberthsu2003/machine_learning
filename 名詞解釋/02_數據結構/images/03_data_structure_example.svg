<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">資料的表格結構：特徵矩陣 X 與標籤向量 y</title>
<desc id="desc">以向量圖形和文字重製的教學圖解。原始 PNG 保留於同一資料夾。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#1e293b} .heading{font-weight:700}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="540" fill="#fff"/>
<text x="600" y="43" font-size="29" text-anchor="middle" class="heading">資料的表格結構：特徵矩陣 X 與標籤向量 y</text>
<rect x="40" y="85" width="1120" height="270" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="180" y="125" font-size="22" text-anchor="middle" class="heading">樣本</text>
<text x="460" y="125" font-size="22" text-anchor="middle" class="heading">面積 X₁（m²）</text>
<text x="740" y="125" font-size="22" text-anchor="middle" class="heading">房間數 X₂</text>
<text x="1020" y="125" font-size="22" text-anchor="middle" class="heading" style="fill:#16834a">售價 y（萬元）</text>
<text x="180" y="173" font-size="22" text-anchor="middle">樣本 1</text>
<text x="460" y="173" font-size="22" text-anchor="middle">100</text>
<text x="740" y="173" font-size="22" text-anchor="middle">2</text>
<text x="1020" y="173" font-size="22" text-anchor="middle" style="fill:#16834a">500</text>
<text x="180" y="221" font-size="22" text-anchor="middle">樣本 2</text>
<text x="460" y="221" font-size="22" text-anchor="middle">80</text>
<text x="740" y="221" font-size="22" text-anchor="middle">1</text>
<text x="1020" y="221" font-size="22" text-anchor="middle" style="fill:#16834a">300</text>
<text x="180" y="269" font-size="22" text-anchor="middle">樣本 3</text>
<text x="460" y="269" font-size="22" text-anchor="middle">120</text>
<text x="740" y="269" font-size="22" text-anchor="middle">3</text>
<text x="1020" y="269" font-size="22" text-anchor="middle" style="fill:#16834a">600</text>
<text x="180" y="317" font-size="22" text-anchor="middle">樣本 4</text>
<text x="460" y="317" font-size="22" text-anchor="middle">90</text>
<text x="740" y="317" font-size="22" text-anchor="middle">2</text>
<text x="1020" y="317" font-size="22" text-anchor="middle" style="fill:#16834a">420</text>
<rect x="40" y="380" width="545" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="60" y="415" font-size="24" class="heading" style="fill:#2563eb">X：4 筆樣本 × 2 個特徵</text>
<text x="60" y="457" font-size="22">每列是一筆樣本，每欄是一個特徵。</text>
<rect x="615" y="380" width="545" height="130" rx="12" fill="#f0fdf4" stroke="#16834a" stroke-width="2"/>
<text x="635" y="415" font-size="24" class="heading" style="fill:#16834a">y：對應每筆樣本的答案</text>
<text x="635" y="457" font-size="22">輸入特徵不包含要預測的售價。</text>
</svg>
