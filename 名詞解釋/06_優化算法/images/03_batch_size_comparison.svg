<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="454" viewBox="0 0 1200 454" role="img" aria-labelledby="title desc">
<title id="title">Batch Size：一次更新使用多少資料？</title>
<desc id="desc">以向量圖形和文字重製的教學圖解。原始 PNG 保留於同一資料夾。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#1e293b} .heading{font-weight:700}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="454" fill="#fff"/>
<text x="600" y="43" font-size="29" text-anchor="middle" class="heading">Batch Size：一次更新使用多少資料？</text>
<rect x="40.0" y="85" width="548.0" height="290" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="60.0" y="120" font-size="24" class="heading" style="fill:#2563eb">較大的批次</text>
<text x="60.0" y="162" font-size="22">以更多樣本估計平均梯度，通常較平穩。</text>
<text x="60.0" y="207" font-size="22">可能提高硬體利用率，但需要更多記憶體。</text>
<text x="60.0" y="252" font-size="22">同一 Epoch 的更新次數較少。</text>
<text x="60.0" y="297" font-size="22">不保證比小批次更好的泛化表現。</text>
<rect x="612.0" y="85" width="548.0" height="290" rx="12" fill="#f0fdf4" stroke="#16834a" stroke-width="2"/>
<text x="632.0" y="120" font-size="24" class="heading" style="fill:#16834a">較小的批次</text>
<text x="632.0" y="162" font-size="22">梯度估計通常較有波動。</text>
<text x="632.0" y="207" font-size="22">記憶體需求較低，同一 Epoch 更新較多次。</text>
<text x="632.0" y="252" font-size="22">可能有助探索，也可能使訓練不穩定。</text>
<text x="632.0" y="297" font-size="22">需一起調整學習率與訓練預算。</text>
<text x="600" y="431" font-size="20" text-anchor="middle">SGD：1 筆；Mini-batch：部分資料；Full-batch：全部訓練資料。</text>
</svg>
