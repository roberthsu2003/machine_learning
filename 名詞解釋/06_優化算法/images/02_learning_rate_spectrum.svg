<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">學習率大小引發的性能光譜</title>
  <desc id="desc">學習率過小、適中與過大對模型訓練過程與收斂結果的影響對比圖解</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans CJK TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      fill: #1e293b;
    }
    .heading { font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>
  <defs>
    <marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="520" fill="#ffffff"/>

  <!-- 主標題與副標題 -->
  <text x="600" y="42" font-size="28" text-anchor="middle" class="heading" fill="#0f172a">學習率大小引發的性能光譜</text>
  <text x="210" y="76" font-size="14" font-weight="600" text-anchor="middle" fill="#64748b">【超參數設定】</text>
  <text x="585" y="76" font-size="14" font-weight="600" text-anchor="middle" fill="#64748b">【優化行進狀態】</text>
  <text x="980" y="76" font-size="14" font-weight="600" text-anchor="middle" fill="#64748b">【最終訓練結果】</text>

  <!-- ==================== Row 1: 學習率過小 ==================== -->
  <!-- 左卡片: 設定 -->
  <rect x="45" y="95" width="330" height="106" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="68" y="130" font-size="20" class="heading" fill="#1d4ed8">學習率過小 (Too Small)</text>
  <text x="68" y="159" font-size="15" class="mono" fill="#2563eb">α = 0.00001 (如 1e-5)</text>
  <text x="68" y="184" font-size="14" fill="#64748b">每次更新步長極微弱，如螞蟻爬行</text>

  <!-- 中間: 過程連線與標籤 -->
  <line x1="375" y1="148" x2="435" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <rect x="435" y="126" width="300" height="44" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="585" y="153" font-size="15" font-weight="600" text-anchor="middle" fill="#475569">步履蹣跚・耗費算力</text>
  <line x1="735" y1="148" x2="795" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- 右卡片: 結果 -->
  <rect x="805" y="95" width="350" height="106" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="828" y="130" font-size="19" class="heading" fill="#334155">訓練極慢・卡在局部極值</text>
  <text x="828" y="158" font-size="14" fill="#64748b">需極巨額迭代，易被困在高原或鞍點</text>
  <text x="828" y="183" font-size="13" font-weight="600" fill="#0284c7">⚠️ 現象：收斂緩慢或未達標準即耗盡 Epoch</text>

  <!-- ==================== Row 2: 學習率適中 ==================== -->
  <!-- 左卡片: 設定 -->
  <rect x="45" y="225" width="330" height="106" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="68" y="260" font-size="20" class="heading" fill="#047857">學習率適中 (Optimal)</text>
  <text x="68" y="289" font-size="15" class="mono" fill="#059669">α = 0.001 (如 1e-3)</text>
  <text x="68" y="314" font-size="14" fill="#64748b">步幅適配，步伐穩健有效推進</text>

  <!-- 中間: 過程連線與標籤 -->
  <line x1="375" y1="278" x2="435" y2="278" stroke="#10b981" stroke-width="2"/>
  <rect x="435" y="256" width="300" height="44" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="585" y="283" font-size="15" font-weight="600" text-anchor="middle" fill="#15803d">穩健下坡・步步為營</text>
  <line x1="735" y1="278" x2="795" y2="278" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 右卡片: 結果 -->
  <rect x="805" y="225" width="350" height="106" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="828" y="260" font-size="19" class="heading" fill="#047857">快速平穩收斂至最優解</text>
  <text x="828" y="288" font-size="14" fill="#64748b">損失單調順暢下降，以合理時間抵達谷底</text>
  <text x="828" y="313" font-size="13" font-weight="600" fill="#16a34a">🎯 現象：理想狀態，兼具效率與模型精度</text>

  <!-- ==================== Row 3: 學習率過大 ==================== -->
  <!-- 左卡片: 設定 -->
  <rect x="45" y="355" width="330" height="106" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="68" y="390" font-size="20" class="heading" fill="#b91c1c">學習率過大 (Too Large)</text>
  <text x="68" y="419" font-size="15" class="mono" fill="#dc2626">α = 10.0 (或激進超標值)</text>
  <text x="68" y="444" font-size="14" fill="#64748b">單步跨度過劇，直接衝過谷底甚至跳崖</text>

  <!-- 中間: 過程連線與標籤 -->
  <line x1="375" y1="408" x2="435" y2="408" stroke="#ef4444" stroke-width="2"/>
  <rect x="435" y="386" width="300" height="44" rx="22" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="585" y="413" font-size="15" font-weight="600" text-anchor="middle" fill="#b91c1c">用力過猛・跨過山谷</text>
  <line x1="735" y1="408" x2="795" y2="408" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 右卡片: 結果 -->
  <rect x="805" y="355" width="350" height="106" rx="12" fill="#fff5f5" stroke="#f87171" stroke-width="1.5"/>
  <text x="828" y="390" font-size="19" class="heading" fill="#991b1b">兩壁劇烈震盪・數值發散</text>
  <text x="828" y="418" font-size="14" fill="#64748b">在兩側山壁間劇烈震盪，甚至數值暴增</text>
  <text x="828" y="443" font-size="13" font-weight="600" fill="#dc2626">💥 現象：Loss 劇烈起伏或出現 NaN / 訓練崩潰</text>

  <!-- 底部說明 -->
  <text x="600" y="495" font-size="14" text-anchor="middle" fill="#64748b">實務策略：常用初始值如 0.001，並搭配學習率調度策略（Learning Rate Decay / Scheduling）動態縮小步長。</text>
</svg>
