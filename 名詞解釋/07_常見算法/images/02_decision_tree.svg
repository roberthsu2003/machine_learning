<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="dt-title dt-desc">
  <title id="dt-title">決策樹 (Decision Tree) 原理：階層式條件規則與空間軸向劃分</title>
  <desc id="dt-desc">對照決策樹的二元邏輯條件樹與在二維特徵空間中的正交矩形切割</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK TC", "Microsoft JhengHei", Roboto, sans-serif; }
      .main-title { font-size: 28px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .panel-title { font-size: 19px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .node-text { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-size: 14px; fill: #475569; text-anchor: middle; font-weight: 500; }
      .edge-text { font-size: 14px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .leaf-title { font-size: 16px; font-weight: 800; text-anchor: middle; }
      .leaf-sub { font-size: 13.5px; text-anchor: middle; font-weight: 600; }
      .axis-label { font-size: 17px; font-weight: 700; fill: #1e293b; }
      .tick-label { font-size: 15px; fill: #475569; font-weight: 600; }
      .region-text { font-size: 19px; font-weight: 800; text-anchor: middle; }
      .footer-title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .footer-item { font-size: 14.5px; fill: #334155; font-weight: 500; }
    </style>
    <filter id="dt-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="dt-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="1180" height="620" fill="#ffffff" rx="14" />
  <text x="590" y="44" class="main-title">決策樹 (Decision Tree) 原理：階層式條件規則與空間軸向劃分</text>
  <!-- LEFT: Tree Structure -->
  <text x="300" y="84" class="panel-title">【結構視角】條件判斷二元樹 (if-else 階層)</text>
  <g filter="url(#dt-shadow)">
    <rect x="185" y="110" width="230" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.2" />
    <text x="300.0" y="136" class="node-text" fill="#1d4ed8">年齡 &lt;= 30 歲？</text>
    <text x="300.0" y="158" class="node-sub">（根節點 / Root：切分年齡軸）</text>
  </g>
  <path d="M 240 170 L 165 230" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#dt-arrow)" />
  <rect x="175" y="185" width="56" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="203" y="201" class="edge-text">是 (True)</text>
  <path d="M 360 170 L 435 230" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#dt-arrow)" />
  <rect x="365" y="185" width="58" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="394" y="201" class="edge-text">否 (False)</text>
  <g filter="url(#dt-shadow)">
    <rect x="60" y="235" width="210" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.2" />
    <text x="165.0" y="261" class="node-text" fill="#b45309">年收入 &lt;= 50 萬？</text>
    <text x="165.0" y="283" class="node-sub">（內部節點：切分收入軸）</text>
  </g>
  <g filter="url(#dt-shadow)">
    <rect x="330" y="235" width="210" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.2" />
    <text x="435.0" y="261" class="node-text" fill="#b45309">年收入 &lt;= 60 萬？</text>
    <text x="435.0" y="283" class="node-sub">（內部節點：切分收入軸）</text>
  </g>
  <path d="M 120 295 L 95 370" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#dt-arrow)" />
  <rect x="90" y="325" width="30" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="105" y="340" class="edge-text">是</text>
  <path d="M 210 295 L 225 370" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#dt-arrow)" />
  <rect x="210" y="325" width="30" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="225" y="340" class="edge-text">否</text>
  <path d="M 390 295 L 375 370" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#dt-arrow)" />
  <rect x="370" y="325" width="30" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="385" y="340" class="edge-text">是</text>
  <path d="M 480 295 L 505 370" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#dt-arrow)" />
  <rect x="485" y="325" width="30" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="500" y="340" class="edge-text">否</text>
  <g filter="url(#dt-shadow)">
    <rect x="35" y="375" width="120" height="58" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2.2" />
    <text x="95.0" y="401" class="leaf-title" fill="#b91c1c">【婉拒貸款】</text>
    <text x="95.0" y="421" class="leaf-sub" fill="#b91c1c">類別 0 (高風險)</text>
  </g>
  <g filter="url(#dt-shadow)">
    <rect x="165" y="375" width="120" height="58" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.2" />
    <text x="225.0" y="401" class="leaf-title" fill="#15803d">【核發貸款】</text>
    <text x="225.0" y="421" class="leaf-sub" fill="#15803d">類別 1 (穩健)</text>
  </g>
  <g filter="url(#dt-shadow)">
    <rect x="315" y="375" width="120" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.2" />
    <text x="375.0" y="401" class="leaf-title" fill="#b45309">【審慎覆核】</text>
    <text x="375.0" y="421" class="leaf-sub" fill="#b45309">類別 0 (需人工)</text>
  </g>
  <g filter="url(#dt-shadow)">
    <rect x="445" y="375" width="120" height="58" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2.2" />
    <text x="505.0" y="401" class="leaf-title" fill="#047857">【極速核准】</text>
    <text x="505.0" y="421" class="leaf-sub" fill="#047857">類別 1 (優質客群)</text>
  </g>
  <rect x="35" y="465" width="530" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="55" y="495" class="footer-title">💡 核心幾何特性：軸向正交切分 (Orthogonal Cuts)</text>
  <text x="55" y="525" class="footer-item">• 每次條件分裂皆相當於在特徵空間畫出一條平行於座標軸的正交切線</text>
  <text x="55" y="555" class="footer-item">• 白盒模型 (White-box)：規則清晰透明，可直接無縫轉化為業務規則落地</text>
  <!-- RIGHT: Spatial Partition -->
  <text x="880" y="84" class="panel-title">【空間視角】正交軸矩形區域分割 (2D 幾何映射)</text>
  <rect x="630" y="360.0" width="108.88888888888891" height="150.0" fill="#fef2f2" />
  <text x="684.4444444444445" y="442.0" class="region-text" fill="#dc2626">婉拒貸款</text>
  <rect x="630" y="110" width="108.88888888888891" height="250.0" fill="#f0fdf4" />
  <text x="684.4444444444445" y="242.0" class="region-text" fill="#16a34a">核發貸款</text>
  <rect x="738.8888888888889" y="310.0" width="381.1111111111111" height="200.0" fill="#fffbeb" />
  <text x="929.4444444444445" y="417.0" class="region-text" fill="#d97706">審核評估</text>
  <rect x="738.8888888888889" y="110" width="381.1111111111111" height="200.0" fill="#ecfdf5" />
  <text x="929.4444444444445" y="217.0" class="region-text" fill="#059669">極速核准</text>
  <rect x="630" y="110" width="490" height="400" fill="none" stroke="#64748b" stroke-width="2" />
  <line x1="630.0" y1="110" x2="630.0" y2="510" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="630.0" y1="510" x2="630.0" y2="516" stroke="#64748b" stroke-width="1.5" />
  <text x="630.0" y="536" class="tick-label" text-anchor="middle">20</text>
  <line x1="738.8888888888889" y1="110" x2="738.8888888888889" y2="510" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="738.8888888888889" y1="510" x2="738.8888888888889" y2="516" stroke="#64748b" stroke-width="1.5" />
  <text x="738.8888888888889" y="536" class="tick-label" text-anchor="middle">30</text>
  <line x1="847.7777777777778" y1="110" x2="847.7777777777778" y2="510" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="847.7777777777778" y1="510" x2="847.7777777777778" y2="516" stroke="#64748b" stroke-width="1.5" />
  <text x="847.7777777777778" y="536" class="tick-label" text-anchor="middle">40</text>
  <line x1="956.6666666666667" y1="110" x2="956.6666666666667" y2="510" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="956.6666666666667" y1="510" x2="956.6666666666667" y2="516" stroke="#64748b" stroke-width="1.5" />
  <text x="956.6666666666667" y="536" class="tick-label" text-anchor="middle">50</text>
  <line x1="1065.5555555555557" y1="110" x2="1065.5555555555557" y2="510" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="1065.5555555555557" y1="510" x2="1065.5555555555557" y2="516" stroke="#64748b" stroke-width="1.5" />
  <text x="1065.5555555555557" y="536" class="tick-label" text-anchor="middle">60</text>
  <line x1="630" y1="510.0" x2="1120" y2="510.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="624" y1="510.0" x2="630" y2="510.0" stroke="#64748b" stroke-width="1.5" />
  <text x="618" y="515.0" class="tick-label" text-anchor="end">20</text>
  <line x1="630" y1="410.0" x2="1120" y2="410.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="624" y1="410.0" x2="630" y2="410.0" stroke="#64748b" stroke-width="1.5" />
  <text x="618" y="415.0" class="tick-label" text-anchor="end">40</text>
  <line x1="630" y1="310.0" x2="1120" y2="310.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="624" y1="310.0" x2="630" y2="310.0" stroke="#64748b" stroke-width="1.5" />
  <text x="618" y="315.0" class="tick-label" text-anchor="end">60</text>
  <line x1="630" y1="210.0" x2="1120" y2="210.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="624" y1="210.0" x2="630" y2="210.0" stroke="#64748b" stroke-width="1.5" />
  <text x="618" y="215.0" class="tick-label" text-anchor="end">80</text>
  <line x1="630" y1="110.0" x2="1120" y2="110.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="624" y1="110.0" x2="630" y2="110.0" stroke="#64748b" stroke-width="1.5" />
  <text x="618" y="115.0" class="tick-label" text-anchor="end">100</text>
  <line x1="738.8888888888889" y1="110" x2="738.8888888888889" y2="510" stroke="#4f46e5" stroke-width="3.5" stroke-dasharray="8,5" />
  <rect x="696.8888888888889" y="120" width="84" height="24" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" />
  <text x="738.8888888888889" y="137" font-size="13px" font-weight="700" fill="#4f46e5" text-anchor="middle">年齡 = 30</text>
  <line x1="630" y1="360.0" x2="738.8888888888889" y2="360.0" stroke="#d97706" stroke-width="3" stroke-dasharray="6,4" />
  <rect x="642" y="338.0" width="92" height="20" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2" />
  <text x="688" y="353.0" font-size="12px" font-weight="700" fill="#d97706" text-anchor="middle">年收入 = 50萬</text>
  <line x1="738.8888888888889" y1="310.0" x2="1120" y2="310.0" stroke="#d97706" stroke-width="3" stroke-dasharray="6,4" />
  <rect x="1016" y="288.0" width="92" height="20" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2" />
  <text x="1062" y="303.0" font-size="12px" font-weight="700" fill="#d97706" text-anchor="middle">年收入 = 60萬</text>
  <text x="875.0" y="560" class="axis-label" text-anchor="middle">年齡 (Age，歲)</text>
  <text x="582" y="310.0" class="axis-label" text-anchor="middle" transform="rotate(-90, 582, 310.0)">年收入 (萬元)</text>
</svg>