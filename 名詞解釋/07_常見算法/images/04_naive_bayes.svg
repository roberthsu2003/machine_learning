<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="409" viewBox="0 0 1200 409" role="img" aria-labelledby="title desc">
<title id="title">樸素貝氏：以條件機率進行分類</title>
<desc id="desc">以向量圖形和文字重製的教學圖解。原始 PNG 保留於同一資料夾。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#1e293b} .heading{font-weight:700}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="409" fill="#fff"/>
<text x="600" y="43" font-size="29" text-anchor="middle" class="heading">樸素貝氏：以條件機率進行分類</text>
<rect x="40.0" y="85" width="548.0" height="245" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="60.0" y="120" font-size="24" class="heading" style="fill:#2563eb">核心概念</text>
<text x="60.0" y="162" font-size="22">P(類別｜特徵) ∝ P(類別) × P(特徵｜類別)。</text>
<text x="60.0" y="207" font-size="22">樸素假設：給定類別後，各特徵條件獨立。</text>
<text x="60.0" y="252" font-size="22">比較各類別的後驗機率，選擇較高者。</text>
<rect x="612.0" y="85" width="548.0" height="245" rx="12" fill="#f0fdf4" stroke="#16834a" stroke-width="2"/>
<text x="632.0" y="120" font-size="24" class="heading" style="fill:#16834a">三種常見模型</text>
<text x="632.0" y="162" font-size="22">GaussianNB：連續特徵，以常態分布建模。</text>
<text x="632.0" y="207" font-size="22">MultinomialNB：計數特徵，例如詞頻。</text>
<text x="632.0" y="252" font-size="22">BernoulliNB：二元特徵，例如詞彙有／無。</text>
<text x="600" y="386" font-size="20" text-anchor="middle">機率模型的選擇必須符合特徵型態；假設不代表現實一定成立。</text>
</svg>
