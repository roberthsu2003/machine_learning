        - paragraph [ref=f3e48]:
          - text: 混淆矩陣是一個二維交叉統計表，精確總結了分類模型的預測結果與真實情況，是所有分類衍生指標的基石。
          - strong [ref=f3e49]: 在醫療檢測等實例中，通常將關注重點設定為「正例（病例／患病）」，無病者為「負例（健康）」。
        - heading "📊 觀念圖解" [level=4] [ref=f3e50]
