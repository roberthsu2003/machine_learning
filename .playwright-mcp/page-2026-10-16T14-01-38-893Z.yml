            - text: ！寧可抓錯十個，也絕不能漏放一個。
          - listitem [ref=f3e280]:
            - strong [ref=f3e281]: 經典應用場景
            - text: ：
            - list [ref=f3e282]:
              - listitem [ref=f3e283]:
                - strong [ref=f3e284]: 惡性腫瘤篩檢
                - text: ：若病患得癌卻被誤判為健康（FN），將延誤就醫導致喪命！
              - listitem [ref=f3e285]:
                - strong [ref=f3e286]: 信用卡盜刷風控
                - text: ：寧可暫時凍結可疑交易打電話確認，也絕不讓盜刷成功。
              - listitem [ref=f3e287]:
                - strong [ref=f3e288]: 防空預警雷達
                - text: ：寧可把大批海鳥誤判為敵機，也絕不能漏掉一枚真實飛彈。
        - separator [ref=f3e289]
        - heading "4. F1 分數 (F1-Score)" [level=3] [ref=f3e290]
        - list [ref=f3e291]:
          - listitem [ref=f3e292]:
            - strong [ref=f3e293]: 數學公式
            - text: ：
            - 'math "\\text{F1} = 2 \\times \\frac{\\text{Precision} \\times \\text{Recall}}{\\text{Precision} + \\text{Recall}} = \\frac{2TP}{2TP + FP + FN}" [ref=f3e295]':
              - generic [ref=f3e296]:
                - generic [ref=f3e297]: F1
                - generic [ref=f3e298]: =
                - generic [ref=f3e299]: "2"
                - generic [ref=f3e300]: ×
                - generic [ref=f3e301]:
                  - generic [ref=f3e302]:
                    - generic [ref=f3e303]: Precision
                    - generic [ref=f3e304]: ×
                    - generic [ref=f3e305]: Recall
                  - generic [ref=f3e306]:
                    - generic [ref=f3e307]: Precision
                    - generic [ref=f3e308]: +
                    - generic [ref=f3e309]: Recall
                - generic [ref=f3e310]: =
                - generic [ref=f3e311]:
                  - generic [ref=f3e312]:
                    - generic [ref=f3e313]: "2"
                    - generic [ref=f3e314]: T
                    - generic [ref=f3e315]: P
                  - generic [ref=f3e316]:
                    - generic [ref=f3e317]: "2"
                    - generic [ref=f3e318]: T
                    - generic [ref=f3e319]: P
                    - generic [ref=f3e320]: +
                    - generic [ref=f3e321]: F
                    - generic [ref=f3e322]: P
                    - generic [ref=f3e323]: +
                    - generic [ref=f3e324]: F
                    - generic [ref=f3e325]: "N"
          - listitem [ref=f3e326]:
            - strong [ref=f3e327]: 含義
            - text: ：精確率與召回率的
            - strong [ref=f3e328]: 調和平均數 (Harmonic Mean)
            - text: 。
          - listitem [ref=f3e329]:
            - strong [ref=f3e330]: 為什麼用調和平均，不用算術平均？
            - text: 調和平均數會對極端微小值施加嚴厲懲罰。如果 Precision 高達 99% 但 Recall 只有 1%，其算術平均為 50%，但 F1 分數會直接跌落至接近 2%！只有在兩者皆優異時，F1 才會高。
          - listitem [ref=f3e331]:
            - strong [ref=f3e332]: 適用場景
            - text: ：數據不平衡，且業務上同時需要兼顧準確性與覆蓋面的綜合評估。
        - separator [ref=f3e333]
        - heading "5. ROC-AUC (受試者工作特徵曲線與曲線下面積)" [level=3] [ref=f3e334]
        - paragraph [ref=f3e335]:
          - text: 在實務中，分類模型輸出的往往不是直接的「是/否」，而是「屬於正類的機率分數」（例如：預測這封信是垃圾信的機率為 0.78）。我們通常預設以 0.5 作為
          - strong [ref=f3e336]: 分類門檻 (Threshold)
          - text: ：大於等於 0.5 就判為正類。
        - paragraph [ref=f3e337]:
          - text: 但門檻不一定要設在 0.5。如果調整門檻，
          - strong [ref=f3e338]: 精確率 (Precision)
          - text: 與
          - strong [ref=f3e339]: 召回率 (Recall)
          - text: 就會出現
          - strong [ref=f3e340]: 此消彼長 (Trade-off)
          - text: 的關係：
        - blockquote [ref=f3e341]:
          - paragraph [ref=f3e342]:
            - text: 💡
            - strong [ref=f3e343]: 生活小範例：醫院的「癌症早期篩檢」
          - list [ref=f3e344]:
            - listitem [ref=f3e345]:
              - strong [ref=f3e346]: 先釐清正例與負例定義
              - text: ：
              - list [ref=f3e347]:
                - listitem [ref=f3e348]:
                  - strong [ref=f3e349]: 正例 (Positive)
                  - text: ：
                  - strong [ref=f3e350]: 「罹癌／病例」
                  - text: （我們關注重點、想主動找出的目標）。
                - listitem [ref=f3e351]:
                  - strong [ref=f3e352]: 負例 (Negative)
                  - text: ：
                  - strong [ref=f3e353]: 「健康／無病」
                  - text: （一般正常狀態）。
                - listitem [ref=f3e354]:
                  - text: 模型輸出的是
                  - strong [ref=f3e355]: 「罹患癌症（正例）的機率分數」
                  - text: 。
            - listitem [ref=f3e356]:
              - strong [ref=f3e357]: 假設把門檻調低（例如降到 0.2）——「寧可錯抓，不能放過」
              - text: ：
              - list [ref=f3e358]:
                - listitem [ref=f3e359]: 只要模型判定有 20% 的罹癌嫌疑，就全部判為正例（診斷為有病），叫來做進一步精密檢查。
                - listitem [ref=f3e360]:
                  - strong [ref=f3e361]: 結果
                  - text: ：幾乎所有真正的病患（真實正例）都被找了出來，漏診極少 ➔
                  - strong [ref=f3e362]: Recall（召回率 / 抓全率）大幅提高
                  - text: ！
                - listitem [ref=f3e363]:
                  - strong [ref=f3e364]: 代價
                  - text: ：許多健康的人（真實負例）也被誤判為有病（假正例 FP 增加，冤枉健康人），在所有被判定有病的人中真正罹癌的比例降低 ➔
                  - strong [ref=f3e365]: Precision（精確率 / 抓準率）下降
                  - text: 。
            - listitem [ref=f3e366]:
              - strong [ref=f3e367]: 假設把門檻調高（例如升到 0.8）——「證據確鑿，才敢斷定」
              - text: ：
              - list [ref=f3e368]:
                - listitem [ref=f3e369]: 模型必須有高達 80% 的把握，才敢判定為正例（診斷為有病）。
                - listitem [ref=f3e370]:
                  - strong [ref=f3e371]: 結果
                  - text: ：只要被判定有病的人，幾乎百分之百真的是病患，很少冤枉健康人（假正例 FP 極少） ➔
                  - strong [ref=f3e372]: Precision（精確率 / 抓準率）大幅提高
                  - text: ！
                - listitem [ref=f3e373]:
                  - strong [ref=f3e374]: 代價
                  - text: ：那些病況不明顯（機率只有 30% ~ 70%）的真正病患全被判定為健康而漏掉了（假負例 FN 暴增） ➔
                  - strong [ref=f3e375]: Recall（召回率 / 抓全率）大幅下降
                  - text: 。
          - paragraph [ref=f3e376]:
            - text: 📌
            - strong [ref=f3e377]: 核心總結
            - text: ：門檻就像一個「嚴格度調節旋鈕」——
            - strong [ref=f3e378]: 門檻越低抓越全但越不準；門檻越高抓越準但越不全
            - text: 。
        - list [ref=f3e379]:
          - listitem [ref=f3e380]:
            - strong [ref=f3e381]: 兩個軸代表什麼意思？（收益 vs 代價）
            - text: ：
            - list [ref=f3e382]:
              - listitem [ref=f3e383]:
                - text: 📈
                - strong [ref=f3e384]: 縱軸（Y 軸）TPR (真正例率 / Recall) ➔ 代表【收益 (Benefit)】
                - text: ：
                - list [ref=f3e385]:
                  - listitem [ref=f3e386]:
                    - strong [ref=f3e387]: 含義
                    - text: ：模型為我們帶來的「好處與收穫」——
                    - strong [ref=f3e388]: 抓對正例（病例）的能力
                    - text: （成功抓出的病患 / 全部真實病患）。
                  - listitem [ref=f3e389]:
                    - strong [ref=f3e390]: 期望
                    - text: ：
                    - strong [ref=f3e391]: 越高越好
                    - text: ，上限是 1.0（代表 100% 的病患都被精準抓出，及早治療拯救生命）。
              - listitem [ref=f3e392]:
                - text: 💸
                - strong [ref=f3e393]: 橫軸（X 軸）FPR (假正例率) ➔ 代表【代價 (Cost)】
                - text: ：
                - list [ref=f3e394]:
                  - listitem [ref=f3e395]:
                    - strong [ref=f3e396]: 含義
                    - text: ：為了獲得上述收益，模型所付出的「損失與副作用」——**誤判負例（健康人）的代價**（被誤診冤枉的健康人 / 全部健康人）。
                  - listitem [ref=f3e397]:
                    - strong [ref=f3e398]: 期望
                    - text: ：
                    - strong [ref=f3e399]: 越低越好
                    - text: ，下限是 0（代表完全沒有冤枉任何健康人，零多餘恐慌與複檢醫療成本）。
              - listitem [ref=f3e400]:
                - text: 🎯
                - strong [ref=f3e401]: 最理想的頂級目標（以最低代價換取最高收益）
                - text: ：落在座標圖的
                - strong [ref=f3e402]: 左上角 (0, 1)
                - text: ➔ 代價為 0（0% 冤枉健康人），收益為 1.0（100% 抓出病患）！
        - blockquote [ref=f3e403]:
          - paragraph [ref=f3e404]:
            - text: 💡
            - strong [ref=f3e405]: 小範例：ROC 曲線是怎麼畫出來的？
            - text: 想像我們把分類門檻從最高（1.0）一路往下調到最低（0.0），看看模型沿途的表現：
          - list [ref=f3e406]:
            - listitem [ref=f3e407]:
              - strong [ref=f3e408]: 門檻設在 1.0（最嚴格）
              - text: ：誰都不抓 ➔ 抓出病患 0%（收益 TPR=0），誤判健康人 0%（代價 FPR=0）。點落在左下角
              - strong [ref=f3e409]: (0, 0)
              - text: 。
            - listitem [ref=f3e410]:
              - strong [ref=f3e411]: 門檻逐漸調低（0.9 ➔ 0.7 ➔ 0.5...）
              - text: ：模型開始指認疑似病例。
              - list [ref=f3e412]:
                - listitem [ref=f3e413]:
                  - strong [ref=f3e414]: 優秀的模型
                  - text: ：會「先精準抓出真正的病患（快速累積收益），而且幾乎不誤判健康人（代價極小）」。這時縱軸 TPR 迅速往上衝，橫軸 FPR 還保持很小，所以
                  - strong [ref=f3e415]: 軌跡會大幅往「左上角」凸起前進
                  - text: ！
                - listitem [ref=f3e416]:
                  - strong [ref=f3e417]: 隨便瞎猜的模型
                  - text: ：每抓到一個病患，就會以相同的機率冤枉一個健康人（收益與代價等比例增加），軌跡只能沿著
                  - strong [ref=f3e418]: 45 度對角線
                  - text: 緩步前進。
            - listitem [ref=f3e419]:
              - strong [ref=f3e420]: 門檻降到 0.0（最寬鬆）
              - text: ：所有人全抓 ➔ 抓出病患 100%（收益 TPR=1.0），但也把所有健康人全當病患（付出了最大代價 FPR=1.0）。點落在右上角
              - strong [ref=f3e421]: (1, 1)
              - text: 。
          - paragraph [ref=f3e422]:
            - text: 📌
            - strong [ref=f3e423]: 把門檻從 1.0 變到 0.0 所經過的所有點連成一條線，這條線就叫「ROC 曲線」
            - text: 。
        - list [ref=f3e424]:
          - listitem [ref=f3e425]:
            - strong [ref=f3e426]: AUC (Area Under Curve，曲線下面積)
            - text: ： ROC 曲線下方的面積大小（介於 0 到 1 之間；低於 0.5 可能表示排序方向反轉），用來客觀總評模型「分辨健康人與病患（負例與正例）的排序實力」：
            - list [ref=f3e427]:
              - listitem [ref=f3e428]:
                - strong [ref=f3e429]: AUC = 1.0（完美無瑕）
                - text: ：曲線直接直角衝上左上角，面積鋪滿整張圖（等於 1）。代表隨機抽一個病患和一個健康人，模型給病患的罹病預測分數
                - strong [ref=f3e430]: 永遠高於
                - text: 健康人！
              - listitem [ref=f3e431]:
                - strong [ref=f3e432]: AUC = 0.5（毫無鑑別力）
                - text: ：曲線就是 (0,0) 到 (1,1) 的對角斜線，面積剛好是一半。代表模型的預測效果跟「閉著眼睛丟銅板盲猜」完全一樣。
              - listitem [ref=f3e433]:
                - strong [ref=f3e434]: 實務表現
                - text: ：一般來說，AUC 在 0.8 以上算良好，0.9 以上算是極為優異的模型。
              - listitem [ref=f3e435]:
                - strong [ref=f3e436]: 最大優點
                - text: ：
                - strong [ref=f3e437]: 衡量跨門檻的排序能力，但類別不平衡時仍應搭配 PR 指標與情境分析
                - text: 。因為 TPR 只計算病患內的比例、FPR 只計算健康人內的比例，即便健康人有 100 萬人、病患只有 10 人，面積數值也不會被稀釋或失真！
        - heading "🎬 互動動畫導覽與操作指引（如何解讀與介紹？）" [level=4] [ref=f3e438]
        - paragraph [ref=f3e439]: 本動畫將門檻調控對各項評估指標的連動影響完全視覺化，可以用以下三個層次來理解與介紹：
        - list [ref=f3e440]:
          - listitem [ref=f3e441]:
            - paragraph [ref=f3e442]:
              - strong [ref=f3e443]: 版面配置與核心元素
              - text: ：
            - list [ref=f3e444]:
              - listitem [ref=f3e445]:
                - strong [ref=f3e446]: 左圖（ROC 曲線）
                - text: ：以 FPR（冤枉好人率）為橫軸、TPR（抓對壞人率）為縱軸；
                - strong [ref=f3e447]: 橘色菱形點
                - text: 即為「目前門檻」在曲線上的即時落點。
              - listitem [ref=f3e448]:
                - strong [ref=f3e449]: 右側指標卡
                - text: ：即時顯示目前門檻下的 Accuracy、Precision、Recall 與 F1 四大指標。
              - listitem [ref=f3e450]:
                - strong [ref=f3e451]: 底部狀態列
                - text: ：即時統計混淆矩陣的四象限計數（TP / FP / FN / TN）與當前整體的 AUC 面積。
          - listitem [ref=f3e452]:
            - paragraph [ref=f3e453]:
              - strong [ref=f3e454]: 滑桿一：分類門檻（判多嚴的業務旋鈕）
              - text: ：
            - list [ref=f3e455]:
              - listitem [ref=f3e456]:
                - strong [ref=f3e457]: 向右調高（如 0.9，從嚴審查）
                - text: ：模型要有 90% 以上把握才判正類 ➔
                - strong [ref=f3e458]: Precision 高達 1.000
                - text: （抓出來的絕對是真病患/真詐欺），但
                - strong [ref=f3e459]: Recall 慘跌至 0.100
                - text: （大部分真正病患都被漏掉了），橘菱形點縮在左下角。
              - listitem [ref=f3e460]:
                - strong [ref=f3e461]: 向左調低（如 0.2，從寬篩檢）
                - text: ：只要有 20% 嫌疑就判正類 ➔ 橘點沿著綠線一路衝向右上角，
                - strong [ref=f3e462]: Recall 暴增到接近 1.0
                - text: （病患全抓到），但
                - strong [ref=f3e463]: Precision 瞬間下跌
                - text: （冤枉一堆健康好人）。
              - listitem [ref=f3e464]:
                - text: 📌
                - strong [ref=f3e465]: 核心洞察
                - text: ：無論門檻如何拖動、右邊指標卡如何上下跳動，
                - strong [ref=f3e466]: 綠色的整條 ROC 曲線與 AUC (如 0.935) 紋風不動
                - text: ！因為 AUC 是看模型的「排序內功」，與外部決策門檻設在多少完全無關。
          - listitem [ref=f3e467]:
            - paragraph [ref=f3e468]:
              - strong [ref=f3e469]: 滑桿二：正類比例（現實環境的分佈挑戰）
              - text: ：
            - list [ref=f3e470]:
              - listitem [ref=f3e471]:
                - text: ❓
                - strong [ref=f3e472]: 什麼是「正類比例」？
                - text: 在分類問題中，我們特別關注、想揪出來的目標事件稱為
                - strong [ref=f3e473]: 正類 (Positive)
                - text: （如：罹癌、信用卡盜刷、違約）。
                - strong [ref=f3e474]: 正類比例
                - text: 就是指測試樣本中，
                - strong [ref=f3e475]: 「真正是正類（目標群體）的樣本佔了百分之幾」
                - text: 。
              - listitem [ref=f3e476]:
                - text: 🔍
                - strong [ref=f3e477]: 實務上我們如何知道正類佔了百分之幾？
                - list [ref=f3e478]:
                  - listitem [ref=f3e479]:
                    - strong [ref=f3e480]: 在動畫中看
                    - text: ：真實正類總數就是混淆矩陣中的
                    - strong [ref=f3e481]: TP + FN
                    - text: （抓對的真病患 TP + 漏抓的真病患 FN）。例如畫面底部的
                    - code [ref=f3e482]: TP 2 / FP 0 / FN 18 / TN 20
                    - text: ，真實正類總數就是
                    - math "2 + 18 = 20" [ref=f3e483]:
                      - generic [ref=f3e484]:
                        - generic [ref=f3e485]: "2"
                        - generic [ref=f3e486]: +
                        - generic [ref=f3e487]: "18"
                        - generic [ref=f3e488]: =
                        - generic [ref=f3e489]: "20"
                    - text: 人，佔總樣本 40 人的 20 / 40 = 50%。
                  - listitem [ref=f3e490]:
                    - strong [ref=f3e491]: 在 Python 程式碼中查
                    - text: ：資料集通常已有標記好的真實答案欄位（
                    - math "y=1" [ref=f3e492]:
                      - generic [ref=f3e493]:
                        - generic [ref=f3e494]: "y"
                        - generic [ref=f3e495]: =
                        - generic [ref=f3e496]: "1"
                    - text: 為正類、
                    - math "y=0" [ref=f3e497]:
                      - generic [ref=f3e498]:
                        - generic [ref=f3e499]: "y"
                        - generic [ref=f3e500]: =
                        - generic [ref=f3e501]: "0"
                    - text: 為負類），只需執行
                    - code [ref=f3e502]: df['label'].value_counts(normalize=True)
                    - text: 或
                    - code [ref=f3e503]: y_true.mean()
                    - text: 即可得知各類別佔比。
                  - listitem [ref=f3e504]:
                    - strong [ref=f3e505]: 在商業與現實環境中
                    - text: ：通常來自歷史統計或領域先驗知識（Domain Knowledge），稱為**「基礎率 (Base Rate)」
                    - strong [ref=f3e506]: 或醫學上的
                    - text: 「盛行率 (Prevalence)」**。例如：銀行過去百萬筆交易中盜刷約佔 0.05%、健檢統計某罕見疾病盛行率約 1%、工廠產線不良品瑕疵率約 2%。
              - listitem [ref=f3e507]:
                - text: 🎲
                - strong [ref=f3e508]: 為什麼寫「重抽 40 筆樣本」？
                - text: 動畫每次固定抽樣 40 筆數據來即時模擬計算：
                - list [ref=f3e509]:
                  - listitem [ref=f3e510]:
                    - strong [ref=f3e511]: 設為 50%（平衡數據）
                    - text: ：40 筆樣本中包含 20 筆真病患（正類）與 20 筆健康人（負類），此時為標準對等分佈。
                  - listitem [ref=f3e512]:
                    - strong [ref=f3e513]: 設為 5%（極端不平衡數據，模擬罕見疾病）
                    - text: ：40 筆樣本中只有 2 筆真病患，高達 38 筆是健康人。這時你會發現就算模型盲猜「全體健康」，Accuracy 也能隨便達到 95%，但 Precision 與 F1 會變得極度敏感脆弱。
              - listitem [ref=f3e514]:
                - text: 📌
                - strong [ref=f3e515]: 核心洞察
                - text: ：調整正類比例是在模擬「把模型丟到不同疾病盛行率的真實世界」。整批數據重新抽樣，因此
                - strong [ref=f3e516]: ROC 曲線的形狀與 AUC 才會跟著重新計算改變
                - text: 。
