            - strong [ref=f2e278]: 被模型猜測為正類
            - text: 的樣本中，實際上真正為正類的比例。
          - listitem [ref=f2e279]:
            - strong [ref=f2e280]: 關注焦點
            - text: ：
            - strong [ref=f2e281]: 極力消滅 FP（誤報）
            - text: ！對應圖解左下角，寧可少猜，也絕不能冤枉好人。
          - listitem [ref=f2e282]:
            - strong [ref=f2e283]: 經典應用場景
            - text: ：
            - list [ref=f2e284]:
              - listitem [ref=f2e285]:
                - strong [ref=f2e286]: 垃圾郵件過濾
                - text: ：把重要工作通知或銀行驗證碼信件當垃圾郵件丟掉（FP）的代價無法承受。
              - listitem [ref=f2e287]:
                - strong [ref=f2e288]: 法庭宣判定罪
                - text: ：寧可放過嫌疑犯，絕不可冤枉無辜好人入獄。
              - listitem [ref=f2e289]:
                - strong [ref=f2e290]: 精準電商推薦
                - text: ：推薦清單必須精準切中用戶喜好，避免打擾顧客。
        - separator [ref=f2e291]
        - heading "4. F1 分數 (F1-Score)" [level=3] [ref=f2e292]
        - list [ref=f2e293]:
          - listitem [ref=f2e294]:
            - strong [ref=f2e295]: 數學公式
            - text: ：
            - 'math "\\text{F1} = 2 \\times \\frac{\\text{Precision} \\times \\text{Recall}}{\\text{Precision} + \\text{Recall}} = \\frac{2TP}{2TP + FP + FN}" [ref=f2e297]':
              - generic [ref=f2e298]:
                - generic [ref=f2e299]: F1
                - generic [ref=f2e300]: =
                - generic [ref=f2e301]: "2"
                - generic [ref=f2e302]: ×
                - generic [ref=f2e303]:
                  - generic [ref=f2e304]:
                    - generic [ref=f2e305]: Precision
                    - generic [ref=f2e306]: ×
                    - generic [ref=f2e307]: Recall
                  - generic [ref=f2e308]:
                    - generic [ref=f2e309]: Precision
                    - generic [ref=f2e310]: +
                    - generic [ref=f2e311]: Recall
                - generic [ref=f2e312]: =
                - generic [ref=f2e313]:
                  - generic [ref=f2e314]:
                    - generic [ref=f2e315]: "2"
                    - generic [ref=f2e316]: T
                    - generic [ref=f2e317]: P
                  - generic [ref=f2e318]:
                    - generic [ref=f2e319]: "2"
                    - generic [ref=f2e320]: T
                    - generic [ref=f2e321]: P
                    - generic [ref=f2e322]: +
                    - generic [ref=f2e323]: F
                    - generic [ref=f2e324]: P
                    - generic [ref=f2e325]: +
                    - generic [ref=f2e326]: F
                    - generic [ref=f2e327]: "N"
          - listitem [ref=f2e328]:
            - strong [ref=f2e329]: 含義
            - text: ：精確率與召回率的
            - strong [ref=f2e330]: 調和平均數 (Harmonic Mean)
            - text: 。
          - listitem [ref=f2e331]:
            - strong [ref=f2e332]: 為什麼用調和平均，不用算術平均？
            - text: 調和平均數會對極端微小值施加嚴厲懲罰。如果 Precision 高達 99% 但 Recall 只有 1%，其算術平均為 50%，但 F1 分數會直接跌落至接近 2%！只有在兩者皆優異時，F1 才會高。
          - listitem [ref=f2e333]:
            - strong [ref=f2e334]: 適用場景
            - text: ：數據不平衡，且業務上同時需要兼顧準確性與覆蓋面的綜合評估。
        - separator [ref=f2e335]
        - heading "5. ROC-AUC (受試者工作特徵曲線與曲線下面積)" [level=3] [ref=f2e336]
        - paragraph [ref=f2e337]:
          - text: 在實務中，分類模型輸出的往往不是直接的「是/否」，而是「屬於正類的機率分數」（例如：預測這封信是垃圾信的機率為 0.78）。我們通常預設以 0.5 作為
          - strong [ref=f2e338]: 分類門檻 (Threshold)
          - text: ：大於等於 0.5 就判為正類。
        - paragraph [ref=f2e339]:
          - text: 但門檻不一定要設在 0.5。如果調整門檻，
          - strong [ref=f2e340]: 精確率 (Precision)
          - text: 與
          - strong [ref=f2e341]: 召回率 (Recall)
          - text: 就會出現
          - strong [ref=f2e342]: 此消彼長 (Trade-off)
          - text: 的關係：
        - blockquote [ref=f2e343]:
          - paragraph [ref=f2e344]:
            - text: 💡
            - strong [ref=f2e345]: 生活小範例：醫院的「癌症早期篩檢」
          - list [ref=f2e346]:
            - listitem [ref=f2e347]:
              - strong [ref=f2e348]: 先釐清正例與負例定義
              - text: ：
              - list [ref=f2e349]:
                - listitem [ref=f2e350]:
                  - strong [ref=f2e351]: 正例 (Positive)
                  - text: ：
                  - strong [ref=f2e352]: 「罹癌／病例」
                  - text: （我們關注重點、想主動找出的目標）。
                - listitem [ref=f2e353]:
                  - strong [ref=f2e354]: 負例 (Negative)
                  - text: ：
                  - strong [ref=f2e355]: 「健康／無病」
                  - text: （一般正常狀態）。
                - listitem [ref=f2e356]: 模型輸出的是**「罹患癌症（正例）的機率分數」**。
            - listitem [ref=f2e357]:
              - strong [ref=f2e358]: 假設把門檻調低（例如降到 0.2）——「寧可錯抓，不能放過」
              - text: ：
              - list [ref=f2e359]:
                - listitem [ref=f2e360]: 只要模型判定有 20% 的罹癌嫌疑，就全部判為正例（診斷為有病），叫來做進一步精密檢查。
                - listitem [ref=f2e361]:
                  - strong [ref=f2e362]: 結果
                  - text: ：幾乎所有真正的病患（真實正例）都被找了出來，漏診極少 ➔
                  - strong [ref=f2e363]: Recall（召回率 / 抓全率）大幅提高
                  - text: ！
                - listitem [ref=f2e364]:
                  - strong [ref=f2e365]: 代價
                  - text: ：許多健康的人（真實負例）也被誤判為有病（假正例 FP 增加，冤枉健康人），在所有被判定有病的人中真正罹癌的比例降低 ➔
                  - strong [ref=f2e366]: Precision（精確率 / 抓準率）下降
                  - text: 。
            - listitem [ref=f2e367]:
              - strong [ref=f2e368]: 假設把門檻調高（例如升到 0.8）——「證據確鑿，才敢斷定」
              - text: ：
              - list [ref=f2e369]:
                - listitem [ref=f2e370]: 模型必須有高達 80% 的把握，才敢判定為正例（診斷為有病）。
                - listitem [ref=f2e371]:
                  - strong [ref=f2e372]: 結果
                  - text: ：只要被判定有病的人，幾乎百分之百真的是病患，很少冤枉健康人（假正例 FP 極少） ➔
                  - strong [ref=f2e373]: Precision（精確率 / 抓準率）大幅提高
                  - text: ！
                - listitem [ref=f2e374]:
                  - strong [ref=f2e375]: 代價
                  - text: ：那些病況不明顯（機率只有 30% ~ 70%）的真正病患全被判定為健康而漏掉了（假負例 FN 暴增） ➔
                  - strong [ref=f2e376]: Recall（召回率 / 抓全率）大幅下降
                  - text: 。
          - paragraph [ref=f2e377]:
            - text: 📌
            - strong [ref=f2e378]: 核心總結
            - text: ：門檻就像一個「嚴格度調節旋鈕」——
            - strong [ref=f2e379]: 門檻越低抓越全但越不準；門檻越高抓越準但越不全
            - text: 。
        - list [ref=f2e380]:
          - listitem [ref=f2e381]:
            - strong [ref=f2e382]: 兩個軸代表什麼意思？（收益 vs 代價）
            - text: ：
            - list [ref=f2e383]:
              - listitem [ref=f2e384]:
                - text: 📈
                - strong [ref=f2e385]: 縱軸（Y 軸）TPR (真正例率 / Recall) ➔ 代表【收益 (Benefit)】
                - text: ：
                - list [ref=f2e386]:
                  - listitem [ref=f2e387]:
                    - strong [ref=f2e388]: 含義
                    - text: ：模型為我們帶來的「好處與收穫」——
                    - strong [ref=f2e389]: 抓對正例（病例）的能力
                    - text: （成功抓出的病患 / 全部真實病患）。
                  - listitem [ref=f2e390]:
                    - strong [ref=f2e391]: 期望
                    - text: ：
                    - strong [ref=f2e392]: 越高越好
                    - text: ，上限是 1.0（代表 100% 的病患都被精準抓出，及早治療拯救生命）。
              - listitem [ref=f2e393]:
                - text: 💸
                - strong [ref=f2e394]: 橫軸（X 軸）FPR (假正例率) ➔ 代表【代價 (Cost)】
                - text: ：
                - list [ref=f2e395]:
                  - listitem [ref=f2e396]:
                    - strong [ref=f2e397]: 含義
                    - text: ：為了獲得上述收益，模型所付出的「損失與副作用」——
                    - strong [ref=f2e398]: 誤判負例（健康人）的代價
                    - text: （被誤診冤枉的健康人 / 全部健康人）。
                  - listitem [ref=f2e399]:
                    - strong [ref=f2e400]: 期望
                    - text: ：
                    - strong [ref=f2e401]: 越低越好
                    - text: ，下限是 0（代表完全沒有冤枉任何健康人，零多餘恐慌與複檢醫療成本）。
              - listitem [ref=f2e402]:
                - text: 🎯
                - strong [ref=f2e403]: 最理想的頂級目標（以最低代價換取最高收益）
                - text: ： 落在座標圖的
                - strong [ref=f2e404]: 左上角 (0, 1)
                - text: ➔ 代價為 0（0% 冤枉健康人），收益為 1.0（100% 抓出病患）！
        - blockquote [ref=f2e405]:
          - paragraph [ref=f2e406]:
            - text: 💡
            - strong [ref=f2e407]: 小範例：ROC 曲線是怎麼畫出來的？
            - text: 想像我們把分類門檻從最高（1.0）一路往下調到最低（0.0），看看模型沿途的表現：
          - list [ref=f2e408]:
            - listitem [ref=f2e409]:
              - strong [ref=f2e410]: 門檻設在 1.0（最嚴格）
              - text: ：誰都不抓 ➔ 抓出病患 0%（收益 TPR=0），誤判健康人 0%（代價 FPR=0）。點落在左下角
              - strong [ref=f2e411]: (0, 0)
              - text: 。
            - listitem [ref=f2e412]:
              - strong [ref=f2e413]: 門檻逐漸調低（0.9 ➔ 0.7 ➔ 0.5...）
              - text: ：模型開始指認疑似病例。
              - list [ref=f2e414]:
                - listitem [ref=f2e415]:
                  - strong [ref=f2e416]: 優秀的模型
                  - text: ：會「先精準抓出真正的病患（快速累積收益），而且幾乎不誤判健康人（代價極小）」。這時縱軸 TPR 迅速往上衝，橫軸 FPR 還保持很小，所以
                  - strong [ref=f2e417]: 軌跡會大幅往「左上角」凸起前進
                  - text: ！
                - listitem [ref=f2e418]:
                  - strong [ref=f2e419]: 隨便瞎猜的模型
                  - text: ：每抓到一個病患，就會以相同的機率冤枉一個健康人（收益與代價等比例增加），軌跡只能沿著
                  - strong [ref=f2e420]: 45 度對角線
                  - text: 緩步前進。
            - listitem [ref=f2e421]:
              - strong [ref=f2e422]: 門檻降到 0.0（最寬鬆）
              - text: ：所有人全抓 ➔ 抓出病患 100%（收益 TPR=1.0），但也把所有健康人全當病患（付出了最大代價 FPR=1.0）。點落在右上角
              - strong [ref=f2e423]: (1, 1)
              - text: 。
          - paragraph [ref=f2e424]:
            - text: 📌
            - strong [ref=f2e425]: 把門檻從 1.0 變到 0.0 所經過的所有點連成一條線，這條線就叫「ROC 曲線」
            - text: 。
        - list [ref=f2e426]:
          - listitem [ref=f2e427]:
            - strong [ref=f2e428]: AUC (Area Under Curve，曲線下面積)
            - text: ： ROC 曲線下方的面積大小（介於 0 到 1 之間；低於 0.5 可能表示排序方向反轉），用來客觀總評模型「分辨健康人與病患（負例與正例）的排序實力」：
            - list [ref=f2e429]:
              - listitem [ref=f2e430]:
                - strong [ref=f2e431]: AUC = 1.0（完美無瑕）
                - text: ：曲線直接直角衝上左上角，面積鋪滿整張圖（等於 1）。代表隨機抽一個病患和一個健康人，模型給病患的罹病預測分數
                - strong [ref=f2e432]: 永遠高於
                - text: 健康人！
              - listitem [ref=f2e433]:
                - strong [ref=f2e434]: AUC = 0.5（毫無鑑別力）
                - text: ：曲線就是 (0,0) 到 (1,1) 的對角斜線，面積剛好是一半。代表模型的預測效果跟「閉著眼睛丟銅板盲猜」完全一樣。
              - listitem [ref=f2e435]:
                - strong [ref=f2e436]: 實務表現
                - text: ：一般來說，AUC 在 0.8 以上算良好，0.9 以上算是極為優異的模型。
              - listitem [ref=f2e437]:
                - strong [ref=f2e438]: 最大優點
                - text: ：
                - strong [ref=f2e439]: 衡量跨門檻的排序能力，但類別不平衡時仍應搭配 PR 指標與情境分析
                - text: 。因為 TPR 只計算病患內的比例、FPR 只計算好人內的比例，即便好人有 100 萬人、病患只有 10 人，面積數值也不會被稀釋或失真！
        - heading "🎬 互動動畫導覽與操作指引（如何解讀與介紹？）" [level=4] [ref=f2e440]
        - paragraph [ref=f2e441]: 本動畫將門檻調控對各項評估指標的連動影響完全視覺化，可以用以下三個層次來理解與介紹：
        - list [ref=f2e442]:
          - listitem [ref=f2e443]:
            - paragraph [ref=f2e444]:
              - strong [ref=f2e445]: 版面配置與核心元素
              - text: ：
            - list [ref=f2e446]:
              - listitem [ref=f2e447]:
                - strong [ref=f2e448]: 左圖（ROC 曲線）
                - text: ：以 FPR（冤枉好人率）為橫軸、TPR（抓對壞人率）為縱軸；
                - strong [ref=f2e449]: 橘色菱形點
                - text: 即為「目前門檻」在曲線上的即時落點。
              - listitem [ref=f2e450]:
                - strong [ref=f2e451]: 右側指標卡
                - text: ：即時顯示目前門檻下的 Accuracy、Precision、Recall 與 F1 四大指標。
              - listitem [ref=f2e452]:
                - strong [ref=f2e453]: 底部狀態列
                - text: ：即時統計混淆矩陣的四象限計數（TP / FP / FN / TN）與當前整體的 AUC 面積。
          - listitem [ref=f2e454]:
            - paragraph [ref=f2e455]:
              - strong [ref=f2e456]: 滑桿一：分類門檻（判多嚴的業務旋鈕）
              - text: ：
            - list [ref=f2e457]:
              - listitem [ref=f2e458]:
                - strong [ref=f2e459]: 向右調高（如 0.9，從嚴審查）
                - text: ：模型要有 90% 以上把握才判正類 ➔
                - strong [ref=f2e460]: Precision 高達 1.000
                - text: （抓出來的絕對是真病患/真詐欺），但
                - strong [ref=f2e461]: Recall 慘跌至 0.100
                - text: （大部分真正病患都被漏掉了），橘菱形點縮在左下角。
              - listitem [ref=f2e462]:
                - strong [ref=f2e463]: 向左調低（如 0.2，從寬篩檢）
                - text: ：只要有 20% 嫌疑就判正類 ➔ 橘點沿著綠線一路衝向右上角，
                - strong [ref=f2e464]: Recall 暴增到接近 1.0
                - text: （病患全抓到），但
                - strong [ref=f2e465]: Precision 瞬間下跌
                - text: （冤枉一堆健康好人）。
              - listitem [ref=f2e466]:
                - text: 📌
                - strong [ref=f2e467]: 核心洞察
                - text: ：無論門檻如何拖動、右邊指標卡如何上下跳動，
                - strong [ref=f2e468]: 綠色的整條 ROC 曲線與 AUC (如 0.935) 紋風不動
                - text: ！因為 AUC 是看模型的「排序內功」，與外部決策門檻設在多少完全無關。
          - listitem [ref=f2e469]:
            - paragraph [ref=f2e470]:
              - strong [ref=f2e471]: 滑桿二：正類比例（現實環境的分佈挑戰）
              - text: ：
            - list [ref=f2e472]:
              - listitem [ref=f2e473]:
                - text: ❓
                - strong [ref=f2e474]: 什麼是「正類比例」？
                - text: 在分類問題中，我們特別關注、想揪出來的目標事件稱為
                - strong [ref=f2e475]: 正類 (Positive)
                - text: （如：罹癌、信用卡盜刷、違約）。
                - strong [ref=f2e476]: 正類比例
                - text: 就是指測試樣本中，
                - strong [ref=f2e477]: 「真正是正類（目標群體）的樣本佔了百分之幾」
                - text: 。
              - listitem [ref=f2e478]:
                - text: 🔍
                - strong [ref=f2e479]: 實務上我們如何知道正類佔了百分之幾？
                - list [ref=f2e480]:
                  - listitem [ref=f2e481]:
                    - strong [ref=f2e482]: 在動畫中看
                    - text: ：真實正類總數就是混淆矩陣中的
                    - strong [ref=f2e483]: TP + FN
                    - text: （抓對的真病患 TP + 漏抓的真病患 FN）。例如畫面底部的
                    - code [ref=f2e484]: TP 2 / FP 0 / FN 18 / TN 20
                    - text: ，真實正類總數就是
                    - math "2 + 18 = 20" [ref=f2e485]:
                      - generic [ref=f2e486]:
                        - generic [ref=f2e487]: "2"
                        - generic [ref=f2e488]: +
                        - generic [ref=f2e489]: "18"
                        - generic [ref=f2e490]: =
                        - generic [ref=f2e491]: "20"
                    - text: 人，佔總樣本 40 人的 20 / 40 = 50%。
                  - listitem [ref=f2e492]:
                    - strong [ref=f2e493]: 在 Python 程式碼中查
                    - text: ：資料集通常已有標記好的真實答案欄位（
                    - math "y=1" [ref=f2e494]:
                      - generic [ref=f2e495]:
                        - generic [ref=f2e496]: "y"
                        - generic [ref=f2e497]: =
                        - generic [ref=f2e498]: "1"
                    - text: 為正類、
                    - math "y=0" [ref=f2e499]:
                      - generic [ref=f2e500]:
                        - generic [ref=f2e501]: "y"
                        - generic [ref=f2e502]: =
                        - generic [ref=f2e503]: "0"
                    - text: 為負類），只需執行
                    - code [ref=f2e504]: df['label'].value_counts(normalize=True)
                    - text: 或
                    - code [ref=f2e505]: y_true.mean()
                    - text: 即可得知各類別佔比。
                  - listitem [ref=f2e506]:
                    - strong [ref=f2e507]: 在商業與現實環境中
                    - text: ：通常來自歷史統計或領域先驗知識（Domain Knowledge），稱為**「基礎率 (Base Rate)」
                    - strong [ref=f2e508]: 或醫學上的
                    - text: 「盛行率 (Prevalence)」**。例如：銀行過去百萬筆交易中盜刷約佔 0.05%、健檢統計某罕見疾病盛行率約 1%、工廠產線不良品瑕疵率約 2%。
              - listitem [ref=f2e509]:
                - text: 🎲
                - strong [ref=f2e510]: 為什麼寫「重抽 40 筆樣本」？
                - text: 動畫每次固定抽樣 40 筆數據來即時模擬計算：
                - list [ref=f2e511]:
                  - listitem [ref=f2e512]:
                    - strong [ref=f2e513]: 設為 50%（平衡數據）
                    - text: ：40 筆樣本中包含 20 筆真病患（正類）與 20 筆健康人（負類），此時為標準對等分佈。
                  - listitem [ref=f2e514]:
                    - strong [ref=f2e515]: 設為 5%（極端不平衡數據，模擬罕見疾病）
                    - text: ：40 筆樣本中只有 2 筆真病患，高達 38 筆是健康人。這時你會發現就算模型盲猜「全體健康」，Accuracy 也能隨便達到 95%，但 Precision 與 F1 會變得極度敏感脆弱。
              - listitem [ref=f2e516]:
                - text: 📌
                - strong [ref=f2e517]: 核心洞察
                - text: ：調整正類比例是在模擬「把模型丟到不同疾病盛行率的真實世界」。整批數據重新抽樣，因此
                - strong [ref=f2e518]: ROC 曲線的形狀與 AUC 才會跟著重新計算改變
                - text: 。
