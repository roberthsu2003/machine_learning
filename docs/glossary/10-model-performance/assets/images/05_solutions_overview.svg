<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="454" viewBox="0 0 1200 454" role="img" aria-labelledby="title desc">
<title id="title">模型表現的改善方向：欠擬合與過度擬合</title>
<desc id="desc">以向量圖形和文字重製的教學圖解。原始 PNG 保留於同一資料夾。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#1e293b} .heading{font-weight:700}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="454" fill="#fff"/>
<text x="600" y="43" font-size="29" text-anchor="middle" class="heading">模型表現的改善方向：欠擬合與過度擬合</text>
<rect x="40.0" y="85" width="548.0" height="290" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="60.0" y="120" font-size="24" class="heading" style="fill:#2563eb">欠擬合：訓練與驗證誤差都高</text>
<text x="60.0" y="162" font-size="22">增加模型容量，捕捉非線性規律。</text>
<text x="60.0" y="207" font-size="22">補充有用特徵與交互特徵。</text>
<text x="60.0" y="252" font-size="22">降低過強的正則化約束。</text>
<text x="60.0" y="297" font-size="22">檢查是否尚未完成收斂。</text>
<rect x="612.0" y="85" width="548.0" height="290" rx="12" fill="#f0fdf4" stroke="#16834a" stroke-width="2"/>
<text x="632.0" y="120" font-size="24" class="heading" style="fill:#16834a">過度擬合：訓練低、驗證高</text>
<text x="632.0" y="162" font-size="22">加入 L1／L2 正則化或 Dropout。</text>
<text x="632.0" y="207" font-size="22">簡化模型或減少無關特徵。</text>
<text x="632.0" y="252" font-size="22">增加有效資料或合理的資料擴增。</text>
<text x="632.0" y="297" font-size="22">依驗證表現設定 Early Stopping。</text>
<text x="600" y="431" font-size="20" text-anchor="middle">先確認資料品質、切分方式與評估流程，再比較改善效果。</text>
</svg>
