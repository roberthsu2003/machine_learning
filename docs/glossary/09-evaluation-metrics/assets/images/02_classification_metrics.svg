<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">分類四大評估指標體系：觀察角度、幾何切片與權衡關係</title>
  <desc id="desc">以混淆矩陣切片幾何為核心，展示準確率(Accuracy)、召回率(Recall)、精確率(Precision)與F1-Score的觀察角度、公式結構與權衡關係。</desc>
  <defs>
    <!-- 陰影效果 -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <!-- 箭頭標記 -->
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7 Z" fill="#d97706" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .title { font-weight: 800; font-size: 25px; fill: #0f172a; }
    .badge-bar { font-size: 14.5px; font-weight: 600; }
    .matrix-head { font-size: 14px; font-weight: 700; fill: #475569; }
    .matrix-title { font-size: 16px; font-weight: 800; }
    .matrix-code { font-size: 18px; font-weight: 800; }
    .matrix-desc { font-size: 12.5px; font-weight: 500; }
    .card-title { font-size: 17.5px; font-weight: 800; }
    .card-formula { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 14px; font-weight: 700; }
    .card-text { font-size: 13.5px; font-weight: 500; line-height: 1.4; fill: #334155; }
    .tag { font-size: 11.5px; font-weight: 700; }
  </style>

  <!-- 背景底色 -->
  <rect width="1200" height="740" fill="#f8fafc"/>

  <!-- 頂部主標題 -->
  <text x="600" y="38" text-anchor="middle" class="title">分類四大評估指標體系：觀察角度、幾何切片與權衡關係</text>

  <!-- 頂部速記口訣提示列 -->
  <rect x="150" y="54" width="900" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="600" y="76" text-anchor="middle" class="badge-bar">
    【核心口訣】
    <tspan fill="#2563eb" font-weight="700">縱看 Precision（猜的準度）</tspan> ｜ 
    <tspan fill="#d97706" font-weight="700">橫看 Recall（抓的全度）</tspan> ｜ 
    <tspan fill="#16a34a" font-weight="700">斜看 Accuracy（對角總和）</tspan> ｜ 
    <tspan fill="#9333ea" font-weight="700">天平 F1（調和平衡）</tspan>
  </text>

  <!-- ========================================== -->
  <!-- 左半部：混淆矩陣幾何切片對照區 (x: 40 ~ 550) -->
  <!-- ========================================== -->
  <g id="confusion-matrix-visual" transform="translate(45, 105)">
    <!-- 矩陣容器背景外框 -->
    <rect x="0" y="0" width="505" height="580" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- 區域標題 -->
    <text x="25" y="32" class="matrix-title" fill="#0f172a">混淆矩陣 2 × 2 視角切片對照圖</text>
    <text x="25" y="52" font-size="12px" fill="#64748b">正例(+) = 病患／有罪／垃圾郵件 ｜ 負例(−) = 健康／無辜／正常郵件</text>

    <!-- 橫軸向：模型預測 (Predicted) 標頭 -->
    <rect x="150" y="72" width="330" height="26" rx="6" fill="#f1f5f9"/>
    <text x="315" y="89" text-anchor="middle" font-size="13px" font-weight="700" fill="#2563eb">【橫軸】模型預測結果 (Predicted)</text>

    <rect x="150" y="104" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="230" y="125" text-anchor="middle" class="matrix-head" fill="#1d4ed8">預測為 正例 (+)</text>

    <rect x="320" y="104" width="160" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="400" y="125" text-anchor="middle" class="matrix-head" fill="#475569">預測為 負例 (−)</text>

    <!-- 縱軸向：真實情況 (Actual) 標頭 -->
    <rect x="18" y="145" width="24" height="280" rx="6" fill="#f1f5f9"/>
    <text x="30" y="240" text-anchor="middle" font-size="13px" font-weight="700" fill="#d97706" transform="rotate(-90 30 240)">【縱軸】真實情況 (Actual)</text>

    <rect x="48" y="145" width="94" height="135" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
    <text x="95" y="200" text-anchor="middle" class="matrix-head" fill="#b45309">真實為</text>
    <text x="95" y="222" text-anchor="middle" font-size="15px" font-weight="800" fill="#b45309">正例 (+)</text>

    <rect x="48" y="290" width="94" height="135" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="95" y="345" text-anchor="middle" class="matrix-head" fill="#475569">真實為</text>
    <text x="95" y="367" text-anchor="middle" font-size="15px" font-weight="800" fill="#475569">負例 (−)</text>

    <!-- ================= 矩陣四格實體 ================= -->
    <!-- 1. TP (真正例) -->
    <rect x="150" y="145" width="160" height="135" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="158" y="153" width="38" height="22" rx="4" fill="#059669"/>
    <text x="177" y="168" text-anchor="middle" font-size="13px" font-weight="800" fill="#ffffff">TP</text>
    <text x="235" y="169" font-size="14px" font-weight="800" fill="#065f46">真正例</text>
    <text x="230" y="196" text-anchor="middle" class="matrix-desc" fill="#047857">猜病例，實際真患病</text>
    <rect x="165" y="212" width="130" height="24" rx="12" fill="#d1fae5"/>
    <text x="230" y="228" text-anchor="middle" font-size="12px" font-weight="700" fill="#065f46">✓ 成功抓出患者</text>
    <text x="230" y="258" text-anchor="middle" font-size="11.5px" font-weight="600" fill="#059669">Accuracy / P / R 共同分子</text>

    <!-- 2. FN (偽負例 / 漏報) -->
    <rect x="320" y="145" width="160" height="135" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <rect x="328" y="153" width="38" height="22" rx="4" fill="#dc2626"/>
    <text x="347" y="168" text-anchor="middle" font-size="13px" font-weight="800" fill="#ffffff">FN</text>
    <text x="405" y="169" font-size="14px" font-weight="800" fill="#991b1b">偽負例 (漏報)</text>
    <text x="400" y="196" text-anchor="middle" class="matrix-desc" fill="#b91c1c">猜健康，實際真患病！</text>
    <rect x="335" y="212" width="130" height="24" rx="12" fill="#fee2e2"/>
    <text x="400" y="228" text-anchor="middle" font-size="12px" font-weight="800" fill="#b91c1c">! 致命漏網之魚</text>
    <text x="400" y="258" text-anchor="middle" font-size="11.5px" font-weight="600" fill="#dc2626">Recall 分母關鍵項</text>

    <!-- 3. FP (偽正例 / 誤報) -->
    <rect x="150" y="290" width="160" height="135" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <rect x="158" y="298" width="38" height="22" rx="4" fill="#d97706"/>
    <text x="177" y="313" text-anchor="middle" font-size="13px" font-weight="800" fill="#ffffff">FP</text>
    <text x="235" y="314" font-size="14px" font-weight="800" fill="#92400e">偽正例 (誤報)</text>
    <text x="230" y="341" text-anchor="middle" class="matrix-desc" fill="#b45309">猜病例，實際很健康！</text>
    <rect x="165" y="357" width="130" height="24" rx="12" fill="#fef3c7"/>
    <text x="230" y="373" text-anchor="middle" font-size="12px" font-weight="800" fill="#b45309">! 冤枉虛驚一場</text>
    <text x="230" y="403" text-anchor="middle" font-size="11.5px" font-weight="600" fill="#d97706">Precision 分母關鍵項</text>

    <!-- 4. TN (真負例) -->
    <rect x="320" y="290" width="160" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="328" y="298" width="38" height="22" rx="4" fill="#475569"/>
    <text x="347" y="313" text-anchor="middle" font-size="13px" font-weight="800" fill="#ffffff">TN</text>
    <text x="405" y="314" font-size="14px" font-weight="800" fill="#334155">真負例</text>
    <text x="400" y="341" text-anchor="middle" class="matrix-desc" fill="#64748b">猜健康，實際真健康</text>
    <rect x="335" y="357" width="130" height="24" rx="12" fill="#e2e8f0"/>
    <text x="400" y="373" text-anchor="middle" font-size="12px" font-weight="700" fill="#334155">✓ 平安無事平安</text>
    <text x="400" y="403" text-anchor="middle" font-size="11.5px" font-weight="600" fill="#475569">Accuracy 對角項</text>

    <!-- ================= 幾何切片動態光罩指示 ================= -->
    <!-- (A) 縱向看：Precision 縱欄光罩 -->
    <rect x="145" y="140" width="170" height="290" rx="10" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85"/>
    <line x1="230" y1="432" x2="230" y2="455" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <rect x="155" y="458" width="150" height="25" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="230" y="475" text-anchor="middle" font-size="12px" font-weight="800" fill="#1d4ed8">縱向看 Precision</text>

    <!-- (B) 橫向看：Recall 橫列光罩 -->
    <rect x="145" y="140" width="340" height="145" rx="10" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85"/>
    <line x1="486" y1="212" x2="497" y2="212" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

    <!-- (C) 對角線 Accuracy 標示條 -->
    <line x1="170" y1="170" x2="450" y2="400" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
    
    <!-- 口訣解析卡 -->
    <rect x="30" y="500" width="445" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="45" y="522" font-size="12.5px" font-weight="700" fill="#0f172a">📐 切片觀察口訣重點：</text>
    <text x="45" y="541" font-size="11.5px" fill="#475569">
      • <tspan font-weight="700" fill="#1d4ed8">Precision（查準率）</tspan>：分子是左上角 TP，分母是<tspan font-weight="700" fill="#1d4ed8">「整個左直欄 (TP + FP)」</tspan>
    </text>
    <text x="45" y="558" font-size="11.5px" fill="#475569">
      • <tspan font-weight="700" fill="#b45309">Recall（查全率）</tspan>：分子是左上角 TP，分母是<tspan font-weight="700" fill="#b45309">「整個上橫列 (TP + FN)」</tspan>
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 右半部：四大指標詳細卡片 (x: 575 ~ 1155) -->
  <!-- ========================================== -->

  <!-- 卡片 1：Precision 精確率 (縱向切片) -->
  <g id="card-precision" transform="translate(575, 105)">
    <rect width="580" height="135" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="8" height="135" rx="4" fill="#2563eb"/>
    <text x="25" y="28" class="card-title" fill="#1d4ed8">1. Precision 精確率（查準率）</text>
    <rect x="260" y="12" width="80" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="300" y="27" text-anchor="middle" class="tag" fill="#1d4ed8">縱向視角</text>

    <!-- 右側公式徽章 -->
    <rect x="365" y="12" width="195" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="462" y="36" text-anchor="middle" class="card-formula" fill="#1e293b">TP / (TP + FP)</text>

    <text x="25" y="60" class="card-text">
      <tspan font-weight="700" fill="#0f172a">核心視角：</tspan>所有被模型猜為正類的樣本中，到底有多少是真的？
    </text>
    <text x="25" y="82" class="card-text">
      <tspan font-weight="700" fill="#b45309">關注重點：</tspan>極力消滅 <tspan font-weight="700" fill="#b45309">FP (誤報)</tspan>！寧可少猜，絕不可胡亂冤枉好人。
    </text>
    <rect x="25" y="96" width="535" height="26" rx="6" fill="#eff6ff"/>
    <text x="35" y="113" font-size="12px" font-weight="600" fill="#1e40af">
      💡 經典場景：垃圾郵件過濾（不可把客戶合約誤當垃圾丟掉）、法庭宣判定罪。
    </text>
  </g>

  <!-- 卡片 2：Recall 召回率 (橫向切片) -->
  <g id="card-recall" transform="translate(575, 253)">
    <rect width="580" height="135" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1.8" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="8" height="135" rx="4" fill="#d97706"/>
    <text x="25" y="28" class="card-title" fill="#b45309">2. Recall 召回率（查全率 / Sensitivity）</text>
    <rect x="325" y="12" width="80" height="22" rx="11" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="365" y="27" text-anchor="middle" class="tag" fill="#b45309">橫向視角</text>

    <!-- 右側公式徽章 -->
    <rect x="420" y="12" width="140" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="490" y="36" text-anchor="middle" class="card-formula" fill="#1e293b">TP / (TP + FN)</text>

    <text x="25" y="60" class="card-text">
      <tspan font-weight="700" fill="#0f172a">核心視角：</tspan>真實世界的所有患病者中，模型成功抓出了多少百分比？
    </text>
    <text x="25" y="82" class="card-text">
      <tspan font-weight="700" fill="#dc2626">關注重點：</tspan>極力消滅 <tspan font-weight="700" fill="#dc2626">FN (漏報)</tspan>！寧可多做檢查，絕不能漏放一個病人！
    </text>
    <rect x="25" y="96" width="535" height="26" rx="6" fill="#fffbeb"/>
    <text x="35" y="113" font-size="12px" font-weight="600" fill="#92400e">
      💡 經典場景：惡性腫瘤篩檢（漏診致死代價過高）、信用卡盜刷風控、飛彈預警。
    </text>
  </g>

  <!-- 卡片 3：Accuracy 準確率 (對角總和) -->
  <g id="card-accuracy" transform="translate(575, 401)">
    <rect width="580" height="135" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.8" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="8" height="135" rx="4" fill="#16a34a"/>
    <text x="25" y="28" class="card-title" fill="#15803d">3. Accuracy 準確率（全域指標）</text>
    <rect x="255" y="12" width="80" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="295" y="27" text-anchor="middle" class="tag" fill="#15803d">對角總和</text>

    <!-- 右側公式徽章 -->
    <rect x="345" y="12" width="215" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="452" y="36" text-anchor="middle" class="card-formula" font-size="12px" fill="#1e293b">(TP + TN) / 全部樣本</text>

    <text x="25" y="60" class="card-text">
      <tspan font-weight="700" fill="#0f172a">核心視角：</tspan>所有樣本中，被模型精準猜對（對角線 TP + TN）的總比例。
    </text>
    <text x="25" y="82" class="card-text">
      <tspan font-weight="700" fill="#b91c1c">🚨 致命陷阱：</tspan>類別不平衡時會嚴重失真！
    </text>
    <rect x="25" y="96" width="535" height="26" rx="6" fill="#fef2f2"/>
    <text x="35" y="113" font-size="11.5px" font-weight="600" fill="#991b1b">
      ⚠️ 99% 健康人中，無腦全猜健康亦有 99% Accuracy，卻無法抓出任何患者！
    </text>
  </g>

  <!-- 卡片 4：F1-Score (調和平均平衡天平) -->
  <g id="card-f1" transform="translate(575, 549)">
    <rect width="580" height="135" rx="12" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.8" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="8" height="135" rx="4" fill="#9333ea"/>
    <text x="25" y="28" class="card-title" fill="#7e22ce">4. F1-Score（綜合調和平均）</text>
    <rect x="255" y="12" width="80" height="22" rx="11" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="295" y="27" text-anchor="middle" class="tag" fill="#7e22ce">天平平衡</text>

    <!-- 右側公式徽章 -->
    <rect x="345" y="12" width="215" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="452" y="36" text-anchor="middle" class="card-formula" font-size="12px" fill="#1e293b">2×P×R / (P + R)</text>

    <text x="25" y="60" class="card-text">
      <tspan font-weight="700" fill="#0f172a">核心視角：</tspan>Precision 與 Recall 彼此拉扯（Trade-off）時的綜合衡量天平。
    </text>
    <text x="25" y="82" class="card-text">
      <tspan font-weight="700" fill="#6b21a8">數學特性：</tspan>採用調和平均數（Harmonic Mean），嚴厲懲罰任何極端短板。
    </text>
    <rect x="25" y="96" width="535" height="26" rx="6" fill="#faf5ff"/>
    <text x="35" y="113" font-size="11.5px" font-weight="600" fill="#6b21a8">
      ⚖️ 只要 Precision 或 Recall 任一項過低，F1 就會被劇烈拉低，無法靠另一項蒙混過關。
    </text>
  </g>

  <!-- 底部版權與註腳說明 -->
  <text x="600" y="718" text-anchor="middle" font-size="12px" fill="#64748b">
    📌 說明：分母為零時指標未定義；調整分類門檻 (Threshold) 會使 Precision 與 Recall 此消彼長，需根據專案成本（誤報代價 vs 漏報代價）決定最佳決策點。
  </text>
</svg>
