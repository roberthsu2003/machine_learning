<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">K-近鄰 (K-NN) 算法原理：少數服從多數的鄰居表決</title>
  <desc id="desc">展示 K-NN 算法在不同 k 值下的鄰域搜索與多數投票分類機制</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK TC", "Microsoft JhengHei", Roboto, sans-serif; }
      .title { font-size: 23px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-size: 13.5px; fill: #64748b; text-anchor: middle; }
      .axis-title { font-size: 13.5px; font-weight: 600; fill: #334155; }
      .axis-tick { font-size: 12px; fill: #64748b; }
      .grid-line { stroke: #f1f5f9; stroke-width: 1; }
      .axis-line { stroke: #94a3b8; stroke-width: 1.5; }
      .k3-circle { fill: rgba(37, 99, 235, 0.07); stroke: #2563eb; stroke-width: 2.2; stroke-dasharray: 6,4; }
      .k5-circle { fill: rgba(147, 51, 234, 0.05); stroke: #9333ea; stroke-width: 2.2; stroke-dasharray: 6,4; }
      .badge-title { font-size: 13px; font-weight: 700; }
      .badge-text { font-size: 12px; fill: #334155; }
      .badge-result { font-size: 13px; font-weight: 700; }
      .card-title { font-size: 14px; font-weight: 700; fill: #1e293b; }
      .card-item { font-size: 13px; fill: #334155; }
      .legend-text { font-size: 12px; fill: #1e293b; font-weight: 500; }
    </style>
    <marker id="arrow-k3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-k5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#9333ea" />
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1000" height="680" fill="#ffffff" rx="12" />
  <text x="500" y="38" class="title">K-近鄰 (K-NN) 算法原理：少數服從多數的鄰居表決</text>
  <text x="500" y="62" class="subtitle">【幾何決策直覺】未知樣本的分類結果，直接取決於 k 值的選擇與鄰域搜索範圍</text>
  <rect x="125.0" y="67.0" width="582.0" height="398.0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="8" />
