  <line x1="135.0" y1="82.0" x2="140.0" y2="82.0" class="axis-line" />
  <text x="130.0" y="86.0" class="axis-tick" text-anchor="end">5</text>
  <text x="416.0" y="490.0" class="axis-title" text-anchor="middle">特徵 1 (Feature 1)</text>
  <text x="102.0" y="266.0" class="axis-title" text-anchor="middle" transform="rotate(-90, 102.0, 266.0)">特徵 2 (Feature 2)</text>
  <!-- k=5 Neighborhood Circle -->
  <circle cx="416.0" cy="266.0" r="126.96" class="k5-circle" />
  <!-- k=3 Neighborhood Circle -->
  <circle cx="416.0" cy="266.0" r="92.0" class="k3-circle" />
  <!-- Data Points -->
  <circle cx="351.6" cy="229.20000000000002" r="8.5" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
  <rect x="463.7" y="203.29999999999998" width="15" height="15" rx="2" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
  <circle cx="360.79999999999995" cy="330.40000000000003" r="8.5" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
  <rect x="482.09999999999997" y="322.90000000000003" width="15" height="15" rx="2" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
  <rect x="509.70000000000005" y="230.9" width="15" height="15" rx="2" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
  <circle cx="305.6" cy="376.4" r="8.5" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
  <rect x="436.09999999999997" y="424.1" width="15" height="15" rx="2" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
  <circle cx="250.40000000000003" cy="192.40000000000003" r="8.5" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
