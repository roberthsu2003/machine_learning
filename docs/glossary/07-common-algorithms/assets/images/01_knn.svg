  <circle cx="232.0" cy="302.79999999999995" r="8.5" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
  <rect x="546.5" y="129.7" width="15" height="15" rx="2" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
  <rect x="574.0999999999999" y="350.5" width="15" height="15" rx="2" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
  <rect x="610.9000000000001" y="212.5" width="15" height="15" rx="2" fill="#ea580c" stroke="#ffffff" stroke-width="2" />
  <circle cx="416.0" cy="266.0" r="16" fill="rgba(16, 185, 129, 0.2)" />
  <!-- Query Sample (Unknown) -->
  <path d="M416.0,252.0 L420.1,260.3 L429.3,261.7 L422.7,268.2 L424.2,277.3 L416.0,273.0 L407.8,277.3 L409.3,268.2 L402.7,261.7 L411.9,260.3 Z" fill="#10b981" stroke="#047857" stroke-width="2" />
  <!-- k=3 Info Badge -->
  <g filter="url(#shadow)">
    <rect x="155" y="95" width="190" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
    <rect x="155" y="95" width="190" height="25" rx="8" fill="#eff6ff" />
    <rect x="155" y="113" width="190" height="7" fill="#eff6ff" />
    <text x="165" y="112" class="badge-title" fill="#1d4ed8">⚡ k = 3 鄰域範圍</text>
    <text x="165" y="138" class="badge-text">2 個類別 A，1 個類別 B</text>
    <text x="165" y="160" class="badge-result" fill="#2563eb">→ 判定：類別 A (2 vs 1)</text>
  </g>
  <path d="M 345 140.0 Q 370 150.0 350.956 200.95600000000002" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-k3)" />
  <!-- k=5 Info Badge -->
  <g filter="url(#shadow)">
    <rect x="505" y="90" width="190" height="80" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.8" />
    <rect x="505" y="90" width="190" height="25" rx="8" fill="#faf5ff" />
    <rect x="505" y="108" width="190" height="7" fill="#faf5ff" />
    <text x="515" y="107" class="badge-title" fill="#7e22ce">🔮 k = 5 鄰域範圍</text>
    <text x="515" y="133" class="badge-text">2 個類別 A，3 個類別 B</text>
    <text x="515" y="155" class="badge-result" fill="#9333ea">→ 判定：類別 B (2 vs 3)</text>
  </g>
  <path d="M 505 140.0 Q 485 150.0 488.8212643591288 162.00045645706962" fill="none" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-k5)" />
  <!-- Legend Box -->
  <g filter="url(#shadow)">
    <rect x="740" y="200" width="225" height="115" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="740" y="200" width="225" height="24" rx="8" fill="#f8fafc" />
    <rect x="740" y="216" width="225" height="8" fill="#f8fafc" />
    <text x="752" y="217" class="badge-title" fill="#475569">圖例說明 (Legend)</text>
    <circle cx="762" cy="240" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    <text x="778" y="244" class="legend-text">類別 A（圓形，標籤 0）</text>
    <rect x="755" y="258" width="14" height="14" rx="2" fill="#ea580c" stroke="#ffffff" stroke-width="1.5" />
    <text x="778" y="269" class="legend-text">類別 B（方形，標籤 1）</text>
    <circle cx="762" cy="294" r="10" fill="rgba(16, 185, 129, 0.2)" />
    <path d="M762.0,285.5 L764.6,290.4 L770.1,291.4 L766.3,295.4 L767.0,300.9 L762.0,298.5 L757.0,300.9 L757.7,295.4 L753.9,291.4 L759.4,290.4 Z" fill="#10b981" stroke="#047857" stroke-width="1" />
    <text x="778" y="298" class="legend-text">待預測樣本（查詢點 ?）</text>
  </g>
  <!-- Bottom Decision Mechanism Card -->
  <g filter="url(#shadow)">
    <rect x="60" y="520" width="880" height="125" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="60" y="520" width="880" height="30" rx="10" fill="#e2e8f0" />
    <rect x="60" y="540" width="880" height="10" fill="#e2e8f0" />
    <text x="500.0" y="541" class="card-title" text-anchor="middle">【 K-NN 核心決策機制：少數服從多數 】</text>
    <text x="85" y="572" class="card-item">1. 計算幾何距離：依特徵向量計算未知樣本與所有已知訓練點的歐氏距離  d = √((x₁ - x₂)² + (y₁ - y₂)²)</text>
    <text x="85" y="597" class="card-item">2. 挑選最近鄰居：將所有距離由近到遠排序，圈出最靠近的前 K 個鄰居樣本（如 k=3 或 k=5）</text>
    <text x="85" y="622" class="card-item">3. 多數投票決定：以鄰居類別的得票數高低決定預測標籤；若 k 太小易受雜訊誤導，k 太大則邊界過度平滑</text>
  </g>
</svg>