  <line x1="324.0" y1="450.0" x2="324.0" y2="455.0" class="axis-line" />
  <text x="324.0" y="470.0" class="axis-tick" text-anchor="middle">3</text>
  <line x1="416.0" y1="450.0" x2="416.0" y2="455.0" class="axis-line" />
  <text x="416.0" y="470.0" class="axis-tick" text-anchor="middle">4</text>
  <line x1="508.0" y1="450.0" x2="508.0" y2="455.0" class="axis-line" />
  <text x="508.0" y="470.0" class="axis-tick" text-anchor="middle">5</text>
  <line x1="600.0" y1="450.0" x2="600.0" y2="455.0" class="axis-line" />
  <text x="600.0" y="470.0" class="axis-tick" text-anchor="middle">6</text>
  <line x1="692.0" y1="450.0" x2="692.0" y2="455.0" class="axis-line" />
  <text x="692.0" y="470.0" class="axis-tick" text-anchor="middle">7</text>
  <line x1="135.0" y1="450.0" x2="140.0" y2="450.0" class="axis-line" />
  <text x="130.0" y="454.0" class="axis-tick" text-anchor="end">1</text>
  <line x1="135.0" y1="358.0" x2="140.0" y2="358.0" class="axis-line" />
  <text x="130.0" y="362.0" class="axis-tick" text-anchor="end">2</text>
  <line x1="135.0" y1="266.0" x2="140.0" y2="266.0" class="axis-line" />
  <text x="130.0" y="270.0" class="axis-tick" text-anchor="end">3</text>
  <line x1="135.0" y1="174.0" x2="140.0" y2="174.0" class="axis-line" />
