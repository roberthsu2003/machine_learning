<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="dt-title dt-desc">
  <title id="dt-title">決策樹 (Decision Tree) 原理：階層式條件規則與空間軸向劃分</title>
  <desc id="dt-desc">對照決策樹的二元邏輯條件樹與在二維特徵空間中的正交矩形切割</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK TC", "Microsoft JhengHei", Roboto, sans-serif; }
      .main-title { font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .panel-title { font-size: 16px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .node-text { font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .node-sub { font-size: 11.5px; fill: #64748b; text-anchor: middle; }
      .edge-text { font-size: 11.5px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .leaf-title { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .leaf-sub { font-size: 11px; text-anchor: middle; }
      .axis-label { font-size: 13px; font-weight: 600; fill: #334155; }
      .tick-label { font-size: 11.5px; fill: #64748b; }
      .region-text { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .footer-text { font-size: 13px; fill: #64748b; text-anchor: middle; }
    </style>
    <filter id="dt-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="dt-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#ffffff" rx="12" />
  <text x="550" y="36" class="main-title">決策樹 (Decision Tree) 原理：階層式條件規則與空間軸向劃分</text>
  <!-- LEFT: Tree Structure -->
  <text x="280" y="72" class="panel-title">【結構視角】條件判斷二元樹 (if-else 階層)</text>
  <g filter="url(#dt-shadow)">
    <rect x="180" y="95" width="200" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    <text x="280.0" y="119" class="node-text" fill="#1d4ed8">年齡 &lt;= 30 歲？</text>
    <text x="280.0" y="137" class="node-sub">（根節點 / Root：切分年齡軸）</text>
  </g>
  <path d="M 230 147 L 160 205" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#dt-arrow)" />
  <rect x="175" y="165" width="46" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="198" y="179" class="edge-text">是 (True)</text>
  <path d="M 330 147 L 400 205" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#dt-arrow)" />
  <rect x="340" y="165" width="48" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="364" y="179" class="edge-text">否 (False)</text>
  <g filter="url(#dt-shadow)">
    <rect x="70" y="210" width="180" height="52" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="160.0" y="234" class="node-text" fill="#b45309">年收入 &lt;= 50 萬？</text>
    <text x="160.0" y="252" class="node-sub">（內部節點：切分收入軸）</text>
  </g>
  <g filter="url(#dt-shadow)">
    <rect x="310" y="210" width="180" height="52" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="400.0" y="234" class="node-text" fill="#b45309">年收入 &lt;= 60 萬？</text>
    <text x="400.0" y="252" class="node-sub">（內部節點：切分收入軸）</text>
  </g>
  <path d="M 120 262 L 95 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#dt-arrow)" />
  <rect x="92" y="285" width="28" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="106" y="298" class="edge-text">是</text>
  <path d="M 200 262 L 210 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#dt-arrow)" />
  <rect x="195" y="285" width="28" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="209" y="298" class="edge-text">否</text>
  <path d="M 360 262 L 335 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#dt-arrow)" />
  <rect x="332" y="285" width="28" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="346" y="298" class="edge-text">是</text>
  <path d="M 440 262 L 450 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#dt-arrow)" />
  <rect x="435" y="285" width="28" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="449" y="298" class="edge-text">否</text>
  <g filter="url(#dt-shadow)">
    <rect x="40" y="335" width="105" height="52" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <text x="92.5" y="359" class="leaf-title" fill="#b91c1c">【婉拒貸款】</text>
    <text x="92.5" y="377" class="leaf-sub" fill="#b91c1c">類別 0 (高風險)</text>
  </g>
  <g filter="url(#dt-shadow)">
    <rect x="160" y="335" width="105" height="52" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
    <text x="212.5" y="359" class="leaf-title" fill="#15803d">【核發貸款】</text>
    <text x="212.5" y="377" class="leaf-sub" fill="#15803d">類別 1 (穩健)</text>
  </g>
  <g filter="url(#dt-shadow)">
    <rect x="280" y="335" width="105" height="52" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <text x="332.5" y="359" class="leaf-title" fill="#b45309">【審慎覆核】</text>
    <text x="332.5" y="377" class="leaf-sub" fill="#b45309">類別 0 (需人工)</text>
  </g>
  <g filter="url(#dt-shadow)">
    <rect x="400" y="335" width="105" height="52" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <text x="452.5" y="359" class="leaf-title" fill="#047857">【極速核准】</text>
    <text x="452.5" y="377" class="leaf-sub" fill="#047857">類別 1 (優質客群)</text>
  </g>
  <rect x="40" y="420" width="465" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="272" y="446" class="node-text" fill="#1e293b">💡 核心幾何特性：軸向正交切分 (Orthogonal Cuts)</text>
  <text x="60" y="472" class="card-item" font-size="12px" fill="#475569">• 每次分裂皆相當於在特徵空間畫出一條平行於座標軸的正交切線</text>
  <text x="60" y="494" class="card-item" font-size="12px" fill="#475569">• 白盒模型 (White-box)：條件清晰易懂，可直接對照業務審核政策落地</text>
  <!-- RIGHT: Spatial Partition -->
  <text x="800" y="72" class="panel-title">【空間視角】正交軸矩形區域分割 (2D 幾何映射)</text>
  <rect x="590" y="331.25" width="100.0" height="138.75" fill="#fef2f2" />
  <text x="640.0" y="406.625" class="region-text" fill="#dc2626">婉拒貸款</text>
  <rect x="590" y="100" width="100.0" height="231.25" fill="#f0fdf4" />
  <text x="640.0" y="221.625" class="region-text" fill="#16a34a">核發貸款</text>
  <rect x="690.0" y="285.0" width="350.0" height="185.0" fill="#fffbeb" />
  <text x="865.0" y="383.5" class="region-text" fill="#d97706">審核評估</text>
  <rect x="690.0" y="100" width="350.0" height="185.0" fill="#ecfdf5" />
  <text x="865.0" y="198.5" class="region-text" fill="#059669">極速核准</text>
  <rect x="590" y="100" width="450" height="370" fill="none" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="590.0" y1="100" x2="590.0" y2="470" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="590.0" y1="470" x2="590.0" y2="475" stroke="#94a3b8" stroke-width="1.2" />
  <text x="590.0" y="490" class="tick-label" text-anchor="middle">20</text>
  <line x1="690.0" y1="100" x2="690.0" y2="470" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="690.0" y1="470" x2="690.0" y2="475" stroke="#94a3b8" stroke-width="1.2" />
  <text x="690.0" y="490" class="tick-label" text-anchor="middle">30</text>
  <line x1="790.0" y1="100" x2="790.0" y2="470" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="790.0" y1="470" x2="790.0" y2="475" stroke="#94a3b8" stroke-width="1.2" />
  <text x="790.0" y="490" class="tick-label" text-anchor="middle">40</text>
  <line x1="890.0" y1="100" x2="890.0" y2="470" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="890.0" y1="470" x2="890.0" y2="475" stroke="#94a3b8" stroke-width="1.2" />
  <text x="890.0" y="490" class="tick-label" text-anchor="middle">50</text>
  <line x1="990.0" y1="100" x2="990.0" y2="470" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="990.0" y1="470" x2="990.0" y2="475" stroke="#94a3b8" stroke-width="1.2" />
  <text x="990.0" y="490" class="tick-label" text-anchor="middle">60</text>
  <line x1="590" y1="470.0" x2="1040" y2="470.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="585" y1="470.0" x2="590" y2="470.0" stroke="#94a3b8" stroke-width="1.2" />
  <text x="580" y="474.0" class="tick-label" text-anchor="end">20</text>
  <line x1="590" y1="377.5" x2="1040" y2="377.5" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="585" y1="377.5" x2="590" y2="377.5" stroke="#94a3b8" stroke-width="1.2" />
  <text x="580" y="381.5" class="tick-label" text-anchor="end">40</text>
  <line x1="590" y1="285.0" x2="1040" y2="285.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="585" y1="285.0" x2="590" y2="285.0" stroke="#94a3b8" stroke-width="1.2" />
  <text x="580" y="289.0" class="tick-label" text-anchor="end">60</text>
  <line x1="590" y1="192.5" x2="1040" y2="192.5" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="585" y1="192.5" x2="590" y2="192.5" stroke="#94a3b8" stroke-width="1.2" />
  <text x="580" y="196.5" class="tick-label" text-anchor="end">80</text>
  <line x1="590" y1="100.0" x2="1040" y2="100.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="585" y1="100.0" x2="590" y2="100.0" stroke="#94a3b8" stroke-width="1.2" />
  <text x="580" y="104.0" class="tick-label" text-anchor="end">100</text>
  <line x1="690.0" y1="100" x2="690.0" y2="470" stroke="#4f46e5" stroke-width="3" stroke-dasharray="6,4" />
  <rect x="654.0" y="108" width="72" height="18" rx="3" fill="#ffffff" stroke="#4f46e5" stroke-width="1" />
  <text x="690.0" y="121" font-size="11px" font-weight="700" fill="#4f46e5" text-anchor="middle">年齡=30</text>
  <line x1="590" y1="331.25" x2="690.0" y2="331.25" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5,3" />
  <rect x="600" y="313.25" width="76" height="16" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1" />
  <text x="638" y="325.25" font-size="10.5px" font-weight="700" fill="#d97706" text-anchor="middle">年收入=50萬</text>
  <line x1="690.0" y1="285.0" x2="1040" y2="285.0" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5,3" />
  <rect x="954" y="267.0" width="76" height="16" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1" />
  <text x="992" y="279.0" font-size="10.5px" font-weight="700" fill="#d97706" text-anchor="middle">年收入=60萬</text>
  <text x="815.0" y="510" class="axis-label" text-anchor="middle">年齡 (Age，歲)</text>
  <text x="548" y="285.0" class="axis-label" text-anchor="middle" transform="rotate(-90, 548, 285.0)">年收入 (萬元)</text>
  <text x="795" y="515" class="footer-text">空間正交切分：由葉節點構成的階梯狀區域</text>
</svg>