  <text x="670" y="450" class="card-title">💡 核技巧 (Kernel Trick) 核心思想</text>
  <text x="670" y="472" class="card-desc">• 當低維空間線性不可分時，核函數隱式將樣本映射至高維</text>
  <text x="670" y="492" class="card-desc">• 在高維空間中只需平直超平面即可一刀切開，計算無負擔！</text>
