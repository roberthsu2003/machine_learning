<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">三份資料的分工：Train／Validation／Test</title>
<desc id="desc">以向量圖形和文字重製的教學圖解。原始 PNG 保留於同一資料夾。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#1e293b} .heading{font-weight:700}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="440" fill="#fff"/>
<text x="600" y="43" font-size="29" text-anchor="middle" class="heading">三份資料的分工：Train／Validation／Test</text>
<rect x="40.0" y="85" width="357.3333333333333" height="276" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="60.0" y="120" font-size="24" class="heading" style="fill:#2563eb">1. 訓練集 Train：70%</text>
<text x="60.0" y="162" font-size="22">學習模型參數。</text>
<text x="60.0" y="207" font-size="22">例如：權重、偏置。</text>
<text x="60.0" y="252" font-size="22">用於擬合與參數更新。</text>
<rect x="421.3333333333333" y="85" width="357.3333333333333" height="276" rx="12" fill="#f0fdf4" stroke="#16834a" stroke-width="2"/>
<text x="441.3333333333333" y="120" font-size="24" class="heading" style="fill:#16834a">2. 驗證集 Validation：</text>
<text x="441.3333333333333" y="151" font-size="24" class="heading" style="fill:#16834a">15%</text>
<text x="441.3333333333333" y="193" font-size="22">挑選模型與超參數。</text>
<text x="441.3333333333333" y="238" font-size="22">例如：樹深度、學習率。</text>
<text x="441.3333333333333" y="283" font-size="22">監控驗證損失與早停。</text>
<rect x="802.6666666666666" y="85" width="357.3333333333333" height="276" rx="12" fill="#fffbeb" stroke="#b86a10" stroke-width="2"/>
<text x="822.6666666666666" y="120" font-size="24" class="heading" style="fill:#b86a10">3. 測試集 Test：15%</text>
<text x="822.6666666666666" y="162" font-size="22">模型定型後最終驗收。</text>
<text x="822.6666666666666" y="207" font-size="22">檢查未見資料的泛化。</text>
<text x="822.6666666666666" y="252" font-size="22">不參與訓練或調參。</text>
<text x="600" y="417" font-size="20" text-anchor="middle">70／15／15 是比例示例，不是所有專案的固定規則。</text>
</svg>
