<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="678" viewBox="0 0 1200 678" role="img" aria-labelledby="title desc">
<title id="title">提升泛化：四個改善方向</title>
<desc id="desc">以向量圖形和文字重製的教學圖解。原始 PNG 保留於同一資料夾。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#1e293b} .heading{font-weight:700}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="678" fill="#fff"/>
<text x="600" y="43" font-size="29" text-anchor="middle" class="heading">提升泛化：四個改善方向</text>
<rect x="40.0" y="85" width="548.0" height="245" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="60.0" y="120" font-size="24" class="heading" style="fill:#2563eb">資料與特徵</text>
<text x="60.0" y="162" font-size="22">增加有代表性的有效資料。</text>
<text x="60.0" y="207" font-size="22">合理資料擴增，維持標籤語意。</text>
<text x="60.0" y="252" font-size="22">檢查標籤品質與特徵資訊。</text>
<rect x="612.0" y="85" width="548.0" height="245" rx="12" fill="#f0fdf4" stroke="#16834a" stroke-width="2"/>
<text x="632.0" y="120" font-size="24" class="heading" style="fill:#16834a">模型容量</text>
<text x="632.0" y="162" font-size="22">選擇合適的深度與複雜度。</text>
<text x="632.0" y="207" font-size="22">必要時剪枝、簡化模型。</text>
<text x="632.0" y="252" font-size="22">比較集成方法的驗證表現。</text>
<rect x="40.0" y="354" width="548.0" height="245" rx="12" fill="#fffbeb" stroke="#b86a10" stroke-width="2"/>
<text x="60.0" y="389" font-size="24" class="heading" style="fill:#b86a10">正則化約束</text>
<text x="60.0" y="431" font-size="22">L1／L2：限制模型權重。</text>
<text x="60.0" y="476" font-size="22">Dropout：訓練時隨機停用部分單元。</text>
<text x="60.0" y="521" font-size="22">約束太強也可能欠擬合。</text>
<rect x="612.0" y="354" width="548.0" height="245" rx="12" fill="#faf5ff" stroke="#8053bc" stroke-width="2"/>
<text x="632.0" y="389" font-size="24" class="heading" style="fill:#8053bc">訓練與評估</text>
<text x="632.0" y="431" font-size="22">用驗證資料調設定與早停。</text>
<text x="632.0" y="476" font-size="22">選擇合適的優化器和學習率。</text>
<text x="632.0" y="521" font-size="22">以交叉驗證檢查穩定性。</text>
<text x="600" y="655" font-size="20" text-anchor="middle">改善需要驗證；不要用最終測試集反覆挑選方案。</text>
</svg>
