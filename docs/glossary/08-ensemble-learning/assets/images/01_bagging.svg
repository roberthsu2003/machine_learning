<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Bagging：有放回抽樣、獨立訓練、整合預測</title>
<desc id="desc">以向量圖形和文字重製的教學圖解。原始 PNG 保留於同一資料夾。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#1e293b} .heading{font-weight:700}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="800" fill="#fff"/>
<text x="600" y="43" font-size="29" text-anchor="middle" class="heading">Bagging：有放回抽樣、獨立訓練、整合預測</text>
<rect x="35" y="305" width="200" height="175" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="55" y="340" font-size="24" class="heading" style="fill:#2563eb">輸入資料 X</text>
<text x="55" y="382" font-size="22">訓練特徵與標籤。</text>
<rect x="280" y="85" width="340" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="300" y="120" font-size="24" class="heading" style="fill:#2563eb">抽樣 1 → 模型 1</text>
<text x="300" y="162" font-size="22">Bootstrap 有放回抽樣。</text>
<text x="300" y="207" font-size="22">各模型獨立訓練。</text>
<path d="M237 390 L278 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M622 170 L690 390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="280" width="340" height="170" rx="12" fill="#f0fdf4" stroke="#16834a" stroke-width="2"/>
<text x="300" y="315" font-size="24" class="heading" style="fill:#16834a">抽樣 2 → 模型 2</text>
<text x="300" y="357" font-size="22">Bootstrap 有放回抽樣。</text>
<text x="300" y="402" font-size="22">各模型獨立訓練。</text>
<path d="M237 390 L278 365" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M622 365 L690 390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="475" width="340" height="170" rx="12" fill="#fffbeb" stroke="#b86a10" stroke-width="2"/>
<text x="300" y="510" font-size="24" class="heading" style="fill:#b86a10">抽樣 3 → 模型 3</text>
<text x="300" y="552" font-size="22">Bootstrap 有放回抽樣。</text>
<text x="300" y="597" font-size="22">各模型獨立訓練。</text>
<path d="M237 390 L278 560" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M622 560 L690 390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="695" y="285" width="275" height="215" rx="12" fill="#faf5ff" stroke="#8053bc" stroke-width="2"/>
<text x="715" y="320" font-size="24" class="heading" style="fill:#8053bc">投票／平均</text>
<text x="715" y="362" font-size="22">分類：多數決。</text>
<text x="715" y="407" font-size="22">回歸：數值平均。</text>
<path d="M973 390 L1018 390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1020" y="325" width="150" height="135" rx="12" fill="#f0fdf4" stroke="#16834a" stroke-width="2"/>
<text x="1040" y="360" font-size="24" class="heading" style="fill:#16834a">預測 ŷ</text>
<text x="1040" y="402" font-size="22">整合結果。</text>
<text x="600" y="710" font-size="20" text-anchor="middle">Bagging：常用於降低變異數；隨機森林另加入特徵抽樣。</text>
<text x="600" y="755" font-size="20" text-anchor="middle">並非保證所有資料上都優於單一模型。</text>
</svg>
