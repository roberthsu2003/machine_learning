<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="409" viewBox="0 0 1200 409" role="img" aria-labelledby="title desc">
<title id="title">Boosting：後一輪補強前一輪的不足</title>
<desc id="desc">以向量圖形和文字重製的教學圖解。原始 PNG 保留於同一資料夾。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#1e293b} .heading{font-weight:700}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="409" fill="#fff"/>
<text x="600" y="43" font-size="29" text-anchor="middle" class="heading">Boosting：後一輪補強前一輪的不足</text>
<rect x="40.0" y="85" width="357.3333333333333" height="245" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="60.0" y="120" font-size="24" class="heading" style="fill:#2563eb">第 1 輪：基礎模型</text>
<text x="60.0" y="162" font-size="22">先建立一個弱學習器。</text>
<text x="60.0" y="207" font-size="22">計算目前預測的誤差。</text>
<rect x="421.3333333333333" y="85" width="357.3333333333333" height="245" rx="12" fill="#f0fdf4" stroke="#16834a" stroke-width="2"/>
<text x="441.3333333333333" y="120" font-size="24" class="heading" style="fill:#16834a">第 2 輪：修正不足</text>
<text x="441.3333333333333" y="162" font-size="22">AdaBoost：提高錯誤樣本權重。</text>
<text x="441.3333333333333" y="207" font-size="22">梯度提升：擬合負梯度。</text>
<text x="441.3333333333333" y="252" font-size="22">平方損失時負梯度對應殘差。</text>
<rect x="802.6666666666666" y="85" width="357.3333333333333" height="245" rx="12" fill="#fffbeb" stroke="#b86a10" stroke-width="2"/>
<text x="822.6666666666666" y="120" font-size="24" class="heading" style="fill:#b86a10">後續輪次與整合</text>
<text x="822.6666666666666" y="162" font-size="22">依序建立新的弱學習器。</text>
<text x="822.6666666666666" y="207" font-size="22">以學習率控制每輪貢獻。</text>
<text x="822.6666666666666" y="252" font-size="22">加總各輪的預測結果。</text>
<text x="600" y="386" font-size="20" text-anchor="middle">後一輪依賴前一輪的結果；需控制複雜度，避免追逐雜訊。</text>
<path d="M399.3333333333333 207.5 L419.3333333333333 207.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M780.6666666666666 207.5 L800.6666666666666 207.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
